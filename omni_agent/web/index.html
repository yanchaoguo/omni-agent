/* ---------- 配置中心(分区布局 + 搜索过滤 + 折叠管理) ---------- */
function EnvModal({onClose,notify}){
  const [data,setData]=useState(null);
  const [edit,setEdit]=useState(null);
  const [nk,setNk]=useState(""); const [nv,setNv]=useState("");
  const [q,setQ]=useState("");
  const [collapsed,setCollapsed]=useState({});
  const load=useCallback(()=>api("/api/settings").then(setData).catch(()=>setData({items:[]})),[]);
  useEffect(()=>{load()},[load]);
  const SRC_BADGE={user:["用户覆盖","bg-emerald-500/20 text-emerald-500 border-emerald-500/40"],
    env:["环境变量","bg-amber-500/20 text-amber-600 border-amber-500/40"],
    project:["项目配置","bg-cyan-500/20 text-cyan-600 border-cyan-500/40"],
    global:["全局配置","bg-violet-500/20 text-violet-600 border-violet-500/40"],
    config:["内置默认","bg-gray-500/10 text-gray-500 border-gray-400/40"],
    default:["默认","bg-gray-500/10 text-gray-500 border-gray-400/40"]};
  const GROUPS=[
    {prefix:"model.",label:" 大模型配置",icon:"text-cyan-400"},
    {prefix:"thinking",label:" 思考模式",icon:"text-fuchsia-400"},
    {prefix:"agent.",label:" 智能体参数",icon:"text-amber-400"},
    {prefix:"reflexion.",label:" 自愈反思",icon:"text-rose-400"},
    {prefix:"image.",label:" 图像生成",icon:"text-emerald-400"},
    {prefix:"browser.",label:" 浏览器",icon:"text-blue-400"},
    {prefix:"prompt_cache.",label:" 提示缓存",icon:"text-indigo-400"},
    {prefix:"unifuncs.",label:" 搜索服务",icon:"text-cyan-400"},
  ];
  const saveEdit=async()=>{
    if(!edit||!edit.env)return;
    const r=await post("/api/env",{action:"set",key:edit.env,value:edit.value});
    notify(r.msg||r.error,!r.ok);setEdit(null);load();};
  const delOverride=async env=>{
    if(!confirm("删除用户级覆盖 "+env+" ？删除后恢复下层配置生效"))return;
    const r=await post("/api/env",{action:"del",key:env});notify(r.msg||r.error,!r.ok);load();};
  const addNew=async()=>{
    if(!nk.trim())return;
    const r=await post("/api/env",{action:"set",key:nk.trim(),value:nv});
    notify(r.msg||r.error,!r.ok);if(r.ok){setNk("");setNv("")}load();};
  const allItems=(data&&data.items)||[];
  const filtered=q.trim()?allItems.filter(it=>{
    const ql=q.toLowerCase();
    return (it.key||"").toLowerCase().includes(ql)||(String(it.value||"")).toLowerCase().includes(ql)
      ||(it.env||"").toLowerCase().includes(ql);
  }):allItems;
  const grouped={};
  const others=[];
  for(const it of filtered){
    const g=GROUPS.find(g=>it.key.startsWith(g.prefix));
    if(g){(grouped[g.label]=grouped[g.label]||[]).push(it);}
    else others.push(it);
  }
  if(others.length) grouped[" 其他配置"]=others;
  const toggle=label=>setCollapsed(c=>({...c,[label]:!c[label]}));
  const renderItem=it=>{
    const badge=SRC_BADGE[it.source]||SRC_BADGE.default;
    const editing=edit&&edit.env===it.env&&edit.key===it.key;
    return html`<div key=${it.key} class="flex items-center gap-2 text-xs bg-black/20 rounded-lg px-3 py-1.5 mb-1">
      <span class="font-mono text-gray-500 w-56 truncate shrink-0" title=${it.env?("env: "+it.env):""}>${it.key}${it.sensitive&&html`<span class="text-[9px] text-yellow-500 ml-1"></span>`}${it.custom&&html`<span class="text-[9px] text-emerald-500 ml-1">自定义</span>`}</span>
      ${editing
        ?html`<input autofocus value=${edit.value} onInput=${e=>setEdit({...edit,value:e.target.value})}
            onKeyDown=${e=>{if(e.key==="Enter")saveEdit();if(e.key==="Escape")setEdit(null)}}
            placeholder=${it.sensitive?"输入新值(明文输入, 保存后打码)":"输入新值"}
            class="flex-1 bg-black/40 border border-cyan-600 rounded px-2 py-1 text-[11px] font-mono outline-none"/>
          <button onClick=${saveEdit} class="text-[10px] px-2 py-0.5 rounded bg-cyan-600 text-white shrink-0">保存</button>
          <button onClick=${()=>setEdit(null)} class="text-[10px] text-gray-500 shrink-0">取消</button>`
        :html`<span class="text-gray-400 truncate flex-1 font-mono">${String(it.value)}</span>
          <span class="text-[9px] px-2 py-0.5 rounded-full border shrink-0 ${badge[1]}">${badge[0]}</span>
          ${it.env&&html`<button onClick=${()=>setEdit({env:it.env,key:it.key,value:""})} title="以用户级变量覆盖当前生效值(最高优先级)" class="text-[10px] text-gray-500 hover:text-cyan-400 shrink-0">✎</button>`}
          ${it.source==="user"&&html`<button onClick=${()=>delOverride(it.env)} title="删除用户级覆盖, 恢复下层配置生效" class="text-[10px] text-gray-500 hover:text-rose-400 shrink-0"></button>`}`}
    </div>`};
  return html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-2 sm:p-6">
    <div class="card p-5 max-w-3xl w-full max-h-[85vh] flex flex-col">
      <div class="flex items-center mb-1"><span class="font-bold text-sm"> 配置中心</span>
         
        <button onClick=${onClose} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button></div>
      <div class="text-[10px] text-gray-500 mb-2">优先级: ${data&&data.priority?data.priority:"用户级 > 环境变量 > 项目 > 全局 > 默认"} </div>
      <div class="mb-3">
        <input value=${q} onInput=${e=>setQ(e.target.value)} placeholder=" 搜索配置项名称、值或环境变量名…"
          class="w-full bg-black/30 border border-gray-700 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-cyan-500"/>
      </div>
      <div class="flex-1 overflow-auto min-h-0 space-y-3">
        ${data===null&&html`<div class="text-xs text-gray-500 blink">加载中…</div>`}
        ${data!==null&&Object.keys(grouped).map(label=>{
          const gi=GROUPS.find(g=>g.label===label);
          const icon=gi?gi.icon:"text-gray-400";
          const isCol=!!collapsed[label];
          return html`<div key=${label}>
            <div class="flex items-center gap-1.5 cursor-pointer select-none mb-1" onClick=${()=>toggle(label)}>
              <span class=${icon+" text-xs font-bold"}>${label}</span>
              <span class="text-[9px] text-gray-600">(${grouped[label].length})</span>
              <span class="text-[10px] text-gray-500 ml-auto">${isCol?"▶":"▼"}</span>
            </div>
            ${!isCol&&grouped[label].map(renderItem)}
          </div>`})}
      </div>
      <div class="flex gap-2 mt-3 pt-3 border-t border-gray-800">
        <input value=${nk} onInput=${e=>setNk(e.target.value)} placeholder="新增自定义变量名（如 MY_TOKEN）"
          class="w-60 bg-black/30 border border-gray-700 rounded-lg px-3 py-1.5 text-xs font-mono outline-none focus:border-cyan-500"/>
        <input value=${nv} onInput=${e=>setNv(e.target.value)} placeholder="变量值" onKeyDown=${e=>{if(e.key==="Enter")addNew()}}
          class="flex-1 bg-black/30 border border-gray-700 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-cyan-500"/>
        <button onClick=${addNew} disabled=${!nk.trim()} class="px-3 py-1.5 rounded-lg text-xs ${nk.trim()?"bg-cyan-600 hover:bg-cyan-500 text-white":"bg-gray-700 text-gray-500"}">新增覆盖</button>
      </div>
    </div>
  </div>`;
}

/* ---------- v4.1 技能管理弹窗: 已安装技能列表 + 勾选启用(规范注入system)/取消勾选(卸载) + 查看SKILL.md(Markdown渲染) + 删除 ---------- */
function SkillsModal({onClose,notify}){
  const [skills,setSkills]=useState(null);
  const [src,setSrc]=useState("");
  const [installing,setInstalling]=useState(false);
  const [pending,setPending]=useState({});   // name -> true(操作中)
  const [expand,setExpand]=useState({});     // name -> 展开详情
  const [mdView,setMdView]=useState(null);   // {name,content} SKILL.md 富渲染弹窗
  const zipRef=useRef(null);   // zip 上传文件选择器
  const [zipName,setZipName]=useState("");   // 已选 zip 文件名
  const load=()=>api("/api/skills").then(r=>setSkills(r.skills||[])).catch(()=>setSkills([]));
  useEffect(()=>{load()},[]);
  const op=async(action,name,source)=>{
    if(action==="install")setInstalling(true);
    const r=await post("/api/skill",{action,name:name||"",source:source||""});
    setInstalling(false);notify(r.msg||r.error,!r.ok);load();
    if(action==="install"&&r.ok)setSrc("");
  };
  /* 上传 zip 包安装技能 */
  const installZip=async file=>{
    if(!file)return;
    if(file.size>50*1024*1024){notify("zip 包超过 50MB 上限",true);return}
    setInstalling(true);setZipName("");
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();
        r.onload=()=>res(String(r.result).split(",",2)[1]||"");
        r.onerror=rej;r.readAsDataURL(file)});
      const r=await post("/api/skill",{action:"install_zip",name:file.name,source:b64});
      notify(r.msg||r.error,!r.ok);load();
    }catch(_){notify("zip 文件读取失败",true)}
    setInstalling(false);
  };
  /* 查看完整 SKILL.md(后端 action=view, 前端 Markdown 富渲染) */
  const viewSkill=async name=>{
    setMdView({name,content:null});
    const r=await post("/api/skill",{action:"view",name});
    if(r.ok)setMdView({name,content:r.content||"(空文件)"});
    else{setMdView(null);notify(r.error||"读取失败",true)}
  };
  /* 勾选=规范注入系统提示(发起对话自动生效); 取消勾选=从当前会话卸载 */
  const toggle=async(sk,checked)=>{
    setPending(p=>({...p,[sk.name]:true}));
    await op(checked?"load":"unload",sk.name);
    setPending(p=>({...p,[sk.name]:false}));
  };
  const loadedCount=(skills||[]).filter(s=>s.loaded).length;
  return html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-2 sm:p-6">
    <div class="card p-5 max-w-2xl w-full max-h-[85vh] flex flex-col" onClick=${e=>e.stopPropagation()}>
      <div class="flex items-center mb-1"><span class="font-bold text-sm">🧩 技能管理</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded-full border border-emerald-300 text-emerald-500 ml-2">已启用 ${loadedCount}/${(skills||[]).length}</span>
        <button onClick=${onClose} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button></div>
      <div class="text-[10px] text-gray-500 mb-3">勾选技能后其完整规范自动追加到系统提示(system), 下次发起对话即生效; 取消勾选则从会话中移除。支持以下安装方式:
        <mark>GitHub owner/repo</mark>(自动识别 skills/ 子目录) ·
        <mark>git URL</mark> · <mark>ModelScope 技能 URL</mark> ·
        <mark>npx skills add 命令</mark>(含 --skill 参数) ·
        <mark>zip 包上传</mark>(需含技能目录/SKILL.md)。安装成功后自动出现在列表。</div>
      <div class="flex-1 overflow-auto space-y-2">
        ${skills===null&&html`<div class="text-xs text-gray-500 blink">加载中…</div>`}
        ${skills&&skills.length===0&&html`<div class="text-xs text-gray-600">（暂无已安装技能，可在下方安装）</div>`}
        ${(skills||[]).map(sk=>html`<div key=${sk.name} class="card p-3 ${sk.loaded?"border-emerald-300":""}">
          <div class="flex items-center gap-2">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" checked=${!!sk.loaded} disabled=${!!pending[sk.name]}
                onChange=${ev=>toggle(sk,ev.target.checked)} class="accent-emerald-500 w-4 h-4"/>
              <span class="text-sm font-mono ${sk.loaded?"text-emerald-300":"text-gray-300"}">${sk.name}</span>
            </label>
            <span class="text-[9px] px-1.5 rounded-full border ${sk.scope==="项目"?"border-cyan-700 text-cyan-400":"border-gray-600 text-gray-400"}">${sk.scope}</span>
            ${pending[sk.name]&&html`<span class="text-[9px] text-cyan-500 blink">处理中…</span>`}
            ${sk.loaded&&!pending[sk.name]&&html`<span class="text-[9px] text-emerald-500">✓ 已启用(本会话可用)</span>`}
            <span class="ml-auto flex gap-1.5">
              <button onClick=${()=>viewSkill(sk.name)}
                class="text-[10px] px-2 py-0.5 rounded border border-violet-400 text-violet-400 hover:bg-cyan-900/40">📖 SKILL.md</button>
              <button onClick=${()=>setExpand(x=>({...x,[sk.name]:!x[sk.name]}))}
                class="text-[10px] px-2 py-0.5 rounded border border-gray-600 text-gray-400 hover:border-cyan-500">${expand[sk.name]?"收起 ▲":"详情 ▼"}</button>
              <button onClick=${()=>{if(confirm("删除技能「"+sk.name+"」？(将从磁盘移除)"))op("remove",sk.name)}} class="text-[10px] px-2 py-0.5 rounded border border-rose-800 text-rose-400 hover:bg-rose-900/40"> 删除</button>
            </span>
          </div>
          ${expand[sk.name]&&html`<pre class="text-[10px] text-gray-500 mt-1.5 max-h-32 overflow-auto bg-black/20 rounded p-2">${sk.brief}</pre>`}
        </div>`)}
      </div>
      <div class="flex gap-2 mt-3">
        <input value=${src} onInput=${e=>setSrc(e.target.value)} placeholder="GitHub owner/repo / git URL / 本地目录 / npx skills add …"
          class="flex-1 bg-black/30 border border-gray-700 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-emerald-500"/>
        <button disabled=${installing||!src.trim()} onClick=${()=>op("install","",src.trim())}
          class="px-3 py-1.5 rounded-lg text-xs ${installing?"bg-gray-700 text-gray-500":"bg-emerald-600 hover:bg-emerald-500 text-white"}">${installing?"安装中…":"⬇ 安装"}</button>
      </div>
      <!-- zip 包上传安装技能 -->
      <div class="flex items-center gap-2 mt-2">
        <input ref=${zipRef} type="file" accept=".zip" class="hidden" onChange=${e=>{const f=e.target.files[0];if(f)installZip(f);e.target.value=""}}/>
        <button disabled=${installing} onClick=${()=>zipRef.current&&zipRef.current.click()}
          class="px-3 py-1.5 rounded-lg text-xs ${installing?"bg-gray-700 text-gray-500":"border border-emerald-700 text-emerald-400 hover:bg-emerald-900/40"}">🗜 上传 zip 安装</button>
        ${zipName&&html`<span class="text-[10px] text-gray-500 truncate">${zipName}</span>`}
        <span class="text-[9px] text-gray-600 ml-auto">zip 需含技能目录/SKILL.md</span>
      </div>
      <!-- SKILL.md 完整内容 Markdown 富渲染二级弹窗 -->
      ${mdView&&html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-2 sm:p-6" onClick=${()=>setMdView(null)}>
        <div class="card p-4 max-w-4xl w-full max-h-[85vh] flex flex-col" onClick=${e=>e.stopPropagation()}>
          <div class="flex items-center gap-2 mb-3">
            <span class="font-bold text-sm text-gray-200">📖 ${mdView.name} / SKILL.md</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded-full border border-violet-300 text-violet-400">Markdown 富渲染</span>
            <button onClick=${()=>setMdView(null)} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button>
          </div>
          <div class="flex-1 overflow-auto rounded-lg bg-white border border-gray-200 p-3">
            ${mdView.content===null
              ?html`<div class="text-sm text-gray-500 blink">加载中…</div>`
              :html`<${Markdown} text=${mdView.content} className="md-doc"/>`}
          </div>
        </div>
      </div>`}
    </div>
  </div>`;
}

/* ---------- v4.2 文件管理弹窗: 本地文件浏览/类型与名称检索/查看/智能体引用分析 ---------- */
const FILE_TYPES=[["all","全部"],["image","🖼 图片"],["doc","📄 文档"],["code","📜 代码"],["media","🎬 媒体"],["data"," 数据"]];
function FilesModal({onClose,notify,onRefFile,onRefFiles,onAnalyzeFile,busy}){
  const [files,setFiles]=useState(null);
  const [sel,setSel]=useState({});   // 多选集合 path -> file
  const [q,setQ]=useState("");
  const [ftype,setFtype]=useState("all");
  const [wd,setWd]=useState("");
  const [defRoot,setDefRoot]=useState("");     // 默认根目录(系统下载目录)
  const [editRoot,setEditRoot]=useState(false); // 根目录编辑态
  const [rootVal,setRootVal]=useState("");
  const [view,setView]=useState(null);   // {name,kind,content|src}
  const timerRef=useRef(null);
  const load=useCallback((qq,tt)=>{
    api(`/api/files?q=${encodeURIComponent(qq)}&type=${tt}&limit=500`)
      .then(r=>{setFiles(r.files||[]);setWd(r.root||r.workdir||"");setDefRoot(r.default_root||"")})
      .catch(()=>setFiles([]));
  },[]);
  useEffect(()=>{load("","all")},[]);
  /* 修改扫描根目录(适配 Windows 路径, 如 C:\\Users\\xx\\Desktop); 空值=重置默认下载目录 */
  const changeRoot=async v=>{
    const r=await post("/api/files_root",{path:v});
    notify(r.msg||r.error,!r.ok);
    if(r.ok){setEditRoot(false);load(q,ftype)}
  };
  /* 搜索防抖: 输入停顿 300ms 后发起检索 */
  const onSearch=v=>{setQ(v);clearTimeout(timerRef.current);
    timerRef.current=setTimeout(()=>load(v,ftype),300)};
  const onType=t=>{setFtype(t);load(q,t)};
  const viewFile=async f=>{
    const ext=(f.ext||"").toLowerCase();
    if(!VIEWABLE_EXT.has(ext)){notify(`该类型(.${ext})不支持在线查看, 请下载后用本地应用打开`,true);return}
    if(TABLE_EXT.includes(ext)){   /* 表格类型 -> 结构化表格渲染 */
      setView({name:f.name,kind:"loading"});
      const r=await post("/api/table_read",{path:f.path,wd:f.wd||""});
      if(!r.ok){setView(null);notify(r.error||"表格读取失败",true);return}
      setView({name:f.name,kind:"table",sheets:r.sheets,truncated:r.truncated});return}
    if(NEWTAB_EXT.includes(ext)){window.open(fileUrl("preview",f),"_blank");return}
    if(AV_EXT[ext]){setView({name:f.name,kind:AV_EXT[ext],src:fileUrl("preview",f)});return}
    setView({name:f.name,kind:"loading"});
    const r=await post("/api/file_read",{path:f.path});
    if(!r.ok){setView(null);notify(r.error||"读取失败",true);return}
    if(r.kind==="image")setView({name:f.name,kind:"image",src:fileUrl("preview",f)});
    else setView({name:f.name,kind:(f.ext==="md"?"markdown":"text"),content:r.content,truncated:r.truncated,path:f.path,wd:f.wd||""});
  };
  return html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-2 sm:p-6">
    <div class="card p-5 max-w-4xl w-full h-[85vh] max-h-[85vh] flex flex-col" onClick=${e=>e.stopPropagation()}>
      <div class="flex items-center mb-1 shrink-0"><span class="font-bold text-sm">📁 文件管理</span>
        ${editRoot
          ?html`<span class="flex items-center gap-1 ml-2 flex-1 max-w-md">
            <input autoFocus value=${rootVal} onInput=${e=>setRootVal(e.target.value)}
              placeholder="输入扫描根目录(如 C:\\Users\\xx\\Desktop 或 /home/xx)，留空=重置默认下载目录"
              onKeyDown=${e=>{if(e.key==="Enter")changeRoot(rootVal.trim());if(e.key==="Escape")setEditRoot(false)}}
              class="flex-1 bg-black/30 border border-cyan-600 rounded px-2 py-0.5 text-[11px] font-mono outline-none"/>
            <button onClick=${()=>changeRoot(rootVal.trim())} class="text-[10px] px-2 py-0.5 rounded bg-cyan-600 text-white">确定</button>
            <button onClick=${()=>setEditRoot(false)} class="text-[10px] px-1.5 py-0.5 rounded border border-gray-600 text-gray-400">取消</button>
          </span>`
          :html`<span class="flex items-center gap-1 ml-2 truncate max-w-md">
            <span class="text-[10px] text-gray-500 truncate" title=${wd}>${wd}</span>
            <button onClick=${()=>{setRootVal(wd);setEditRoot(true)}} title="修改扫描根目录(适配 Windows 路径)"
              class="text-[10px] px-1.5 py-0.5 rounded border border-gray-700 text-gray-400 hover:border-cyan-500 shrink-0">✎ 改目录</button>
            ${defRoot&&wd!==defRoot&&html`<button onClick=${()=>changeRoot("")} title=${"重置为默认下载目录: "+defRoot}
              class="text-[10px] px-1.5 py-0.5 rounded border border-gray-700 text-gray-400 hover:border-yellow-500 shrink-0">↺ 默认</button>`}
          </span>`}
        <span class="ml-auto flex items-center gap-2">
        ${Object.keys(sel).length>0&&html`<button onClick=${()=>{const fs=Object.values(sel);onRefFiles(fs);setSel({});onClose();notify(`已将 ${fs.length} 个文件引用导入对话输入框`)}}
          class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs">📥 导入所选 (${Object.keys(sel).length})</button>
        <button onClick=${()=>setSel({})} class="px-2 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">清空选择</button>`}
        <button onClick=${()=>load(q,ftype)} class="px-2 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-cyan-500 text-xs">⟳ 刷新</button></span>
        <button onClick=${onClose} class="ml-2 px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button></div>
       
      <div class="flex gap-2 mb-2 items-center shrink-0">
        <span class="relative flex-1">
          <input value=${q} onInput=${e=>onSearch(e.target.value)} placeholder=" 按文件名检索（实时过滤）…"
            class="w-full bg-black/30 border border-gray-700 rounded-lg px-3 py-1.5 pr-8 text-xs outline-none focus:border-cyan-500"/>
          ${q&&html`<button onClick=${()=>onSearch("")} title="清空输入"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-4.5 h-4.5 flex items-center justify-center rounded-full text-gray-400 hover:text-rose-500 text-[11px] leading-none px-1">✕</button>`}
        </span>
        <div class="flex gap-1">
          ${FILE_TYPES.map(([t,label])=>html`<button key=${t} onClick=${()=>onType(t)}
            class="text-[11px] px-2 py-1 rounded ${ftype===t?"bg-cyan-700 text-white":"bg-gray-800 text-gray-400 hover:text-gray-200"}">${label}</button>`)}
        </div>
      </div>
      <div class="flex-1 overflow-auto space-y-1" style=${{minHeight:"220px"}}>
        ${files===null&&html`<div class="text-xs text-gray-500 blink">扫描中…</div>`}
        ${files&&files.length===0&&html`<div class="text-xs text-gray-600 text-center mt-8">（未找到匹配文件）</div>`}
        ${(files||[]).map((f,i)=>html`<div key=${i} class="flex items-center gap-2 text-xs bg-black/25 rounded-lg px-3 py-2 ${f.dup?"border border-yellow-500/60":sel[f.path]?"border border-emerald-500/60":""}">
          <input type="checkbox" checked=${!!sel[f.path]} title="勾选后可批量导入到对话框"
            onChange=${ev=>setSel(s=>{const n={...s};if(ev.target.checked)n[f.path]=f;else delete n[f.path];return n})}
            class="accent-emerald-500 shrink-0 cursor-pointer"/>
          <span>${fileIcon(f.ext)}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-gray-200 truncate">${f.name}</span>
              ${f.dup&&html`<span class="text-[9px] px-1.5 rounded-full border border-yellow-500 text-yellow-500 shrink-0" title="存在同名文件"> 同名</span>`}
              <span class="text-gray-600 shrink-0">${fmtSize(f.size)}</span>
              <span class="text-gray-600 shrink-0">${f.mtime_str}</span>
            </div>
            ${f.dup
              ?html`<div class="text-[10px] mt-0.5 truncate" title=${f.abs_path}><mark>${f.abs_path}</mark></div>`
              :html`<div class="text-[10px] text-gray-500 mt-0.5 truncate">${f.path}</div>`}
          </div>
          <span class="flex gap-1.5 shrink-0">
            ${VIEWABLE_EXT.has((f.ext||"").toLowerCase())
              ?html`<button onClick=${()=>viewFile(f)} class="px-2 py-1 rounded-lg border border-gray-600 text-gray-300 hover:border-cyan-500 text-[11px]">👁 查看</button>`
              :html`<button disabled title="该类型(.${f.ext})不支持在线查看, 请下载后用本地应用打开"
                class="px-2 py-1 rounded-lg border border-gray-800 text-gray-600 text-[11px] cursor-not-allowed opacity-50">🚫 查看</button>`}
            <button onClick=${()=>{onRefFile(f);onClose()}} title="将文件路径插入输入框供智能体引用"
              class="px-2 py-1 rounded-lg border border-emerald-700 text-emerald-400 hover:bg-emerald-900/40 text-[11px]">📎 引用</button>
            <button disabled=${busy} onClick=${()=>{onAnalyzeFile(f);onClose()}} title="立即发起智能体分析任务"
              class="px-2 py-1 rounded-lg bg-violet-700 hover:bg-violet-600 text-white text-[11px] ${busy?"opacity-40":""}">⚡ 分析</button>
            <a href=${fileUrl("download",f)} download=${f.name}
              class="px-2 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-cyan-500 text-[11px]">⬇</a>
          </span>
        </div>`)}
        ${files&&files.length>=500&&html`<div class="text-[10px] text-yellow-500 text-center py-1">仅展示前 500 个结果, 请细化检索条件</div>`}
      </div>
      <!-- 文件内容查看二级弹窗 -->
      ${view&&html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-2 sm:p-6">
        <div class="card p-4 max-w-4xl w-full max-h-[85vh] flex flex-col" onClick=${e=>e.stopPropagation()}>
          <div class="flex items-center gap-2 mb-3"><span class="font-bold text-sm text-gray-200 truncate">👁 ${view.name}</span>
            <button onClick=${()=>setView(null)} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button></div>
          <div class="flex-1 overflow-auto rounded-lg ${view.kind==="markdown"?"bg-white border border-gray-200":"bg-black/30"} p-2">
            ${view.kind==="loading"&&html`<div class="text-sm text-gray-500 blink mt-4 text-center">加载中…</div>`}
            ${view.kind==="image"&&html`<img src=${view.src} class="max-w-full max-h-[70vh] object-contain rounded mx-auto" alt=${view.name}/>`}
            ${view.kind==="audio"&&html`<audio controls src=${view.src} class="w-full mt-6"></audio>`}
            ${view.kind==="table"&&html`<${TableView} sheets=${view.sheets} truncated=${view.truncated}/>`}
            ${view.kind==="video"&&html`<video controls src=${view.src} class="max-w-full max-h-[70vh] rounded mx-auto"></video>`}
            ${view.kind==="text"&&html`<pre class="text-xs text-gray-300 leading-relaxed">${view.content}</pre>`}
            ${view.kind==="markdown"&&html`<${MdPane} name=${view.name} path=${view.path} wd=${view.wd||""} content=${view.content} truncated=${view.truncated} notify=${notify}/>`}
          </div>
          ${view.truncated&&html`<div class="text-[10px] text-yellow-500 mt-1">内容较长, 仅展示前 60000 字符</div>`}
        </div>
      </div>`}
    </div>
  </div>`;
}


/* ---------- 工作空间弹窗 —— 任务工作目录文件管理(首次对话前可切换目录, 任务开始后锁定) ---------- */
function WorkspaceModal({onClose, busy, state, onRefFile, notify}) {
  const [data, setData] = useState(null);    // {dirs, files, workdir, rel, locked}
  const [rel, setRel] = useState("");
  const [showChange, setShowChange] = useState(false);
  const [rootVal, setRootVal] = useState("");
  const [view, setView] = useState(null);    // 文件预览二级弹窗
  const [dirData, setDirData] = useState(null);   // 目录点选浏览数据
  const [showMkdir, setShowMkdir] = useState(false);  // 创建文件夹面板
  const [mkName, setMkName] = useState("");            // 新文件夹名称
  const [mkParent, setMkParent] = useState("");        // 新文件夹父目录

  const load = useCallback((d) => {
    api(`/api/workspace?dir=${encodeURIComponent(d || "")}`)
      .then(r => { if (r.ok) { setData(r); setRel(r.rel || ""); } else { notify(r.error || "加载失败", true); } })
      .catch(() => setData({ok: false, error: "网络错误"}));
  }, []);

  useEffect(() => { load(""); }, []);

  // 进入子文件夹
  const enterDir = (d) => { const nrel = (d.rel || "").replace(/\\/g, "/"); setRel(nrel); load(nrel); };
  // 返回上级
  const goUp = () => { const parts = (rel || "").split("/").filter(Boolean); parts.pop(); const nrel = parts.join("/"); setRel(nrel); load(nrel); };

  // 切换目录(点选确认或手动输入兜底)
  // 「选用此目录」时判断目录是否为空 —— 非空则弹窗提示, 确认后携 force 执行
  const changeDir = async (force) => {
    if (!rootVal.trim()) { notify("请点选或输入目标目录", true); return; }
    const r = await post("/api/workspace_root", {path: rootVal.trim(), force: !!force});
    if (r.confirm) {
      if (confirm(" " + (r.error || "目标目录非空") + "\n该目录已有内容, 切换后任务文件将与现有文件混合存放。\n确认要选用此目录吗?")) {
        return changeDir(true);
      }
      return;
    }
    notify(r.msg || r.error, !r.ok);
    if (r.ok) { setShowChange(false); setDirData(null); setRel(""); setData(null); load(""); }
  };
  // 创建新文件夹(支持命名)
  const createDir = async () => {
    if (!mkName.trim()) { notify("文件夹名称不能为空", true); return; }
    const r = await post("/api/mkdir", {parent: mkParent || (dirData ? dirData.path : rootVal), name: mkName.trim()});
    if (!r.ok) { notify(r.error || "创建失败", true); return; }
    notify(r.msg || "✓ 文件夹已创建");
    setMkName(""); setShowMkdir(false);
    browseDir(mkParent || (dirData ? dirData.path : rootVal));
  };
  // 目录点选浏览 —— 逐级点击导航选择工作目录(无需手写路径)
  const browseDir = async (p) => {
    try {
      const r = await api(`/api/dir_browse?path=${encodeURIComponent(p || "")}`);
      if (r.ok) { setDirData(r); setRootVal(r.path); }
      else notify(r.error || "目录读取失败", true);
    } catch (_) { notify("目录读取失败: 网络错误", true); }
  };

  // 文件预览(支持代码/md/文本/图片)
  const viewFile = async (f) => {
    const ext = (f.ext || "").toLowerCase();
    const srcUrl = `/api/preview?path=${encodeURIComponent(f.path)}${f.wd ? "&wd=" + encodeURIComponent(f.wd) : ""}`;
    if (["png","jpg","jpeg","gif","svg","webp","ico"].includes(ext)) { setView({name: f.name, kind: "image", src: srcUrl}); return; }
    if (["html","htm","pdf"].includes(ext)) { window.open(srcUrl, "_blank"); return; }
    if (AV_EXT[ext]) { setView({name: f.name, kind: AV_EXT[ext], src: srcUrl}); return; } /* 音视频统一预览 */
    if (TABLE_EXT.includes(ext)) {   /* 表格类型 -> 结构化表格渲染 */
      setView({name: f.name, kind: "loading"});
      const r = await post("/api/table_read", {path: f.path, wd: f.wd || ""});
      if (!r.ok) { setView({name: f.name, kind: "text", content: "[预览失败] " + (r.error || "表格读取失败")}); notify(r.error || "表格读取失败", true); return; }
      setView({name: f.name, kind: "table", sheets: r.sheets, truncated: r.truncated}); return; }
    setView({name: f.name, kind: "loading"});
    const r = await post("/api/workspace_read", {path: f.path});
    if (!r.ok) { setView({name: f.name, kind: "text", content: "[预览失败] " + (r.error || "读取失败") + "\n请尝试下载后本地查看。"}); notify(r.error || "读取失败", true); return; }
    setView({name: r.name || f.name, kind: (ext === "md" || ext === "markdown") ? "markdown" : "text", content: r.content, truncated: r.truncated, path: f.path, wd: f.wd || ""});
  };

  const downloadUrl = (f) => `/api/download?path=${encodeURIComponent(f.path)}${f.wd ? "&wd=" + encodeURIComponent(f.wd) : ""}`;
  const locked = data && data.locked;

  return html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-2 sm:p-6">
    <div class="card p-5 max-w-4xl w-full h-[85vh] max-h-[85vh] flex flex-col" onClick=${e => e.stopPropagation()}>
      <div class="flex items-center mb-2">
        <span class="font-bold text-sm">📂 工作空间</span>
        <span class="text-[10px] text-gray-500 truncate ml-2 max-w-md" title=${data ? data.workdir : ""}>${data ? data.workdir : "加载中…"}</span>
        ${locked && html`<span class="text-[9px] px-1.5 py-0.5 rounded-full border border-cyan-700 text-cyan-500 ml-1 shrink-0" title=${data.locked_reason || "任务已开始, 目录已锁定"}> 已锁定</span>`}
        ${!locked && html`<span class="text-[9px] px-1.5 py-0.5 rounded-full border border-emerald-600 text-emerald-500 ml-1 shrink-0" title="首次对话前可切换目录">✓ 可切换</span>`}
        <span class="ml-auto flex items-center gap-2">
          ${!locked && html`<button onClick=${() => { if (showChange) { setShowChange(false); setDirData(null); } else { setRootVal(data ? data.workdir : ""); setShowChange(true); browseDir(data ? data.workdir : ""); } }} title="切换任务工作目录(仅首次对话前可用, 支持点选导航)"
            class="text-[10px] px-2.5 py-1 rounded-lg border border-cyan-700 text-cyan-400 hover:bg-cyan-900/40"> 切换目录</button>`}
          <button onClick=${() => load(rel)} class="px-2 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-cyan-500 text-xs">⟳ 刷新</button>
          <button onClick=${onClose} class="px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button>
        </span>
      </div>
      <!-- 面包屑导航 -->
      <div class="flex items-center gap-1 text-[11px] text-gray-500 mb-2 flex-wrap">
        <button onClick=${() => { setRel(""); load(""); }} class="hover:text-cyan-400"> 根目录</button>
        ${(rel || "").split("/").filter(Boolean).map((part, i, arr) => {
          const crumb = arr.slice(0, i + 1).join("/");
          return html`<span key=${i} class="text-gray-600">/</span>
            <button onClick=${() => { setRel(crumb); load(crumb); }} class="hover:text-cyan-400 truncate max-w-[120px]">${part}</button>`;
        })}
      </div>
      <!-- 切换目录 —— 点选式目录浏览器(逐级导航点选, 手动输入仅作兜底) -->
      ${showChange && html`<div class="mb-2 bg-black/20 rounded-lg px-3 py-2 space-y-2">
        <div class="flex items-center gap-2">
          <input value=${rootVal} onInput=${e => setRootVal(e.target.value)} placeholder="点选下方目录导航, 或手动输入路径后回车跳转"
            onKeyDown=${e => { if (e.key === "Enter") browseDir(rootVal.trim()); if (e.key === "Escape") { setShowChange(false); setDirData(null); } }}
            class="flex-1 bg-black/30 border border-cyan-600 rounded px-2 py-1 text-[11px] font-mono outline-none" />
          <button onClick=${() => browseDir(rootVal.trim())} title="跳转到输入的路径" class="text-[10px] px-2 py-1 rounded border border-cyan-700 text-cyan-400 hover:bg-cyan-900/40">↵ 跳转</button>
          <button onClick=${() => { setMkParent(dirData ? dirData.path : rootVal); setMkName(""); setShowMkdir(v=>!v); }} title="在当前浏览目录下创建新文件夹(支持命名)"
            class="text-[10px] px-2 py-1 rounded border border-emerald-700 text-emerald-400 hover:bg-emerald-900/40">📂+ 新建文件夹</button>
          <button onClick=${() => changeDir(false)} class="text-[10px] px-2.5 py-1 rounded bg-cyan-600 hover:bg-cyan-500 text-white"> 确定</button>
          <button onClick=${() => { setShowChange(false); setDirData(null); }} class="text-[10px] px-1.5 py-1 rounded border border-gray-600 text-gray-400">取消</button>
        </div>
        ${showMkdir && html`<div class="flex items-center gap-1.5 bg-emerald-900/20 rounded-lg px-2.5 py-1.5">
          <span class="text-[10px] text-emerald-500 shrink-0">📂 新建于:</span>
          <span class="text-[9px] text-gray-500 truncate flex-1 font-mono" title=${mkParent}>${mkParent}</span>
          <input autoFocus value=${mkName} onInput=${e=>setMkName(e.target.value)}
            onKeyDown=${e=>{if(e.key==="Enter"&&mkName.trim())createDir();if(e.key==="Escape")setShowMkdir(false)}}
            placeholder="输入文件夹名称" class="w-36 bg-black/30 border border-emerald-600 rounded px-2 py-0.5 text-[11px] outline-none" />
          <button onClick=${createDir} class="text-[10px] px-2 py-0.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white">✓ 创建</button>
          <button onClick=${()=>setShowMkdir(false)} class="text-[10px] px-1.5 py-0.5 rounded border border-gray-600 text-gray-400">取消</button>
        </div>`}
        ${dirData && html`<div>
          <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
            <span class="text-[10px] text-gray-500">快捷:</span>
            <button onClick=${() => browseDir(dirData.home)} class="text-[10px] px-2 py-0.5 rounded border border-gray-700 text-gray-400 hover:border-cyan-500 hover:text-cyan-400">🏠 主目录</button>
            ${dirData.projects_root && html`<button onClick=${() => browseDir(dirData.projects_root)} class="text-[10px] px-2 py-0.5 rounded border border-gray-700 text-gray-400 hover:border-cyan-500 hover:text-cyan-400"> 项目根目录</button>`}
            <span class="text-[10px] text-cyan-500/80 truncate ml-1 flex-1 font-mono" title=${dirData.path}>📍 ${dirData.path}</span>
          </div>
          <div class="max-h-44 overflow-auto space-y-0.5 border border-gray-800 rounded-lg p-1 bg-black/20">
            ${dirData.parent && html`<div onClick=${() => browseDir(dirData.parent)}
              class="flex items-center gap-2 text-[11px] text-gray-400 hover:text-cyan-400 cursor-pointer px-2 py-1 rounded hover:bg-gray-800/60">
              <span>📁</span><span>.. (上级目录)</span></div>`}
            ${(dirData.dirs || []).map((d, i) => html`<div key=${i} onClick=${() => browseDir(d.path)}
              class="flex items-center gap-2 text-[11px] text-gray-300 hover:text-cyan-300 cursor-pointer px-2 py-1 rounded hover:bg-gray-800/60">
              <span>📁</span><span class="truncate">${d.name}</span></div>`)}
            ${dirData.dirs && dirData.dirs.length === 0 && html`<div class="text-[10px] text-gray-600 text-center py-2">（无子文件夹, 可直接点击「✓ 选用此目录」）</div>`}
          </div>
        </div>`}
        ${!dirData && html`<div class="text-[10px] text-gray-600 blink">目录加载中…</div>`}
      </div>`}
       
      <!-- 文件列表 -->
      <div class="flex-1 overflow-auto space-y-0.5">
        ${data === null && html`<div class="text-xs text-gray-500 blink text-center mt-8">加载中…</div>`}
        ${data && data.ok === false && html`<div class="text-xs text-rose-400 text-center mt-8"> ${data.error || "加载失败"}</div>`}
        ${data && data.ok && html`
          ${rel && html`<div onClick=${goUp} class="flex items-center gap-2 text-xs text-gray-400 hover:text-cyan-400 cursor-pointer px-3 py-1.5 rounded-lg hover:bg-gray-800/60">
            <span>📁</span><span>.. (上级目录)</span></div>`}
          ${(data.dirs || []).map((d, i) => html`<div key=${"d" + i} onClick=${() => enterDir(d)}
            class="flex items-center gap-2 text-xs bg-black/25 rounded-lg px-3 py-2 hover:border-cyan-500 cursor-pointer border border-transparent">
            <span>📁</span><span class="text-gray-200 truncate flex-1">${d.name}</span>
            <span class="text-gray-600 text-[10px]">${d.count} 项</span>
            <span class="text-gray-600 text-[10px]">${d.rel}</span></div>`)}
          ${(data.files || []).length === 0 && (data.dirs || []).length === 0 && !rel && html`<div class="text-xs text-gray-600 text-center mt-8">（空目录）</div>`}
          ${(data.files || []).map((f, i) => html`<div key=${"f" + i} class="flex items-center gap-2 text-xs bg-black/25 rounded-lg px-3 py-2 border border-transparent hover:border-gray-600">
            <span>${fileIcon(f.ext)}</span>
            <span class="text-gray-200 truncate flex-1" title=${f.path}>${f.name}</span>
            <span class="text-gray-600 shrink-0">${fmtSize(f.size)}</span>
            <span class="text-gray-600 shrink-0 text-[10px]">${f.mtime_str}</span>
            <span class="flex gap-1.5 shrink-0">
              ${f.previewable
                ? html`<button onClick=${() => viewFile(f)} class="px-2 py-1 rounded-lg border border-gray-600 text-gray-300 hover:border-cyan-500 text-[11px]">👁 预览</button>`
                : html`<button disabled title="该类型不支持在线预览" class="px-2 py-1 rounded-lg border border-gray-800 text-gray-600 text-[11px] cursor-not-allowed opacity-50">🚫 预览</button>`}
              <button onClick=${() => { onRefFile(f); onClose(); notify(`已引用文件: ${f.name}`); }} title="将文件路径插入输入框供智能体引用"
                class="px-2 py-1 rounded-lg border border-emerald-700 text-emerald-400 hover:bg-emerald-900/40 text-[11px]">📎 引用</button>
              <a href=${downloadUrl(f)} download=${f.name} class="px-2 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-cyan-500 text-[11px]">⬇ 下载</a>
            </span></div>`)}
        `}
      </div>
      <!-- 文件预览二级弹窗 -->
      ${view && html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-2 sm:p-6">
        <div class="card p-4 max-w-4xl w-full max-h-[85vh] flex flex-col" onClick=${e => e.stopPropagation()}>
          <div class="flex items-center gap-2 mb-3">
            <span class="font-bold text-sm text-gray-200 truncate">👁 ${view.name}</span>
            <button onClick=${() => setView(null)} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button>
          </div>
          <div class="flex-1 overflow-auto rounded-lg ${view.kind === "markdown" ? "bg-white border border-gray-200" : "bg-black/30"} p-2">
            ${view.kind === "loading" && html`<div class="text-sm text-gray-500 blink mt-4 text-center">加载中…</div>`}
            ${view.kind === "image" && html`<img src=${view.src} class="max-w-full max-h-[70vh] object-contain rounded mx-auto" alt=${view.name} />`}
            ${view.kind === "text" && html`<pre class="text-xs text-gray-300 leading-relaxed">${view.content}</pre>`}
            ${view.kind === "markdown" && html`<${MdPane} name=${view.name} path=${view.path} wd=${view.wd||""} content=${view.content} truncated=${view.truncated} notify=${notify}/>`}
            ${view.kind === "table" && html`<${TableView} sheets=${view.sheets} truncated=${view.truncated}/>`}
            ${view.kind === "audio" && html`<audio controls src=${view.src} class="w-full mt-6"></audio>`}
            ${view.kind === "video" && html`<video controls src=${view.src} class="max-w-full max-h-[70vh] rounded mx-auto"></video>`}
          </div>
          ${view.truncated && html`<div class="text-[10px] text-yellow-500 mt-1">内容较长, 仅展示前 60000 字符</div>`}
        </div>
      </div>`}
    </div>
  </div>`;
}

/* ---------- 定时任务管理弹窗(新建/启用停用/删除, 复用 scheduler 配置内核) ---------- */
function ScheduleModal({onClose,notify}){
  const [data,setData]=useState(null);
  const [name,setName]=useState("");
  const [jprompt,setJprompt]=useState("");
  const [timerType,setTimerType]=useState("every");
  const [every,setEvery]=useState("3600");
  const [atTime,setAtTime]=useState("08:30");
  const [cronExpr,setCronExpr]=useState("0 * * * *");
  const [enabled,setEnabled]=useState(true);
  const [project,setProject]=useState("");
  const load=useCallback(()=>api("/api/schedule").then(r=>setData(r)).catch(()=>setData({jobs:[],scheduler_online:false})),[]);
  useEffect(()=>{load()},[]);
  const add=async()=>{
    const job={name:name.trim()||"定时任务",prompt:jprompt.trim(),enabled};
    if(project.trim())job.project=project.trim();
    if(timerType==="every")job.every=parseInt(every)||3600;
    else if(timerType==="at")job.at=atTime;
    else job.cron=cronExpr;
    const r=await post("/api/schedule",{action:"add",job});
    notify(r.msg||r.error,!r.ok);
    if(r.ok){setName("");setJprompt("");load();}
  };
  const del=async jid=>{if(!confirm("删除定时任务 "+jid+" ？"))return;const r=await post("/api/schedule",{action:"delete",id:jid});notify(r.msg||r.error,!r.ok);load();};
  const toggle=async jid=>{const r=await post("/api/schedule",{action:"toggle",id:jid});notify(r.msg||r.error,!r.ok);load();};
  const fmtTimer=j=>j.every?("每 "+j.every+" 秒"):j.at?("每天 "+j.at):j.cron?("cron: "+j.cron):"?";
  const jobs=(data&&data.jobs)||[];
  return html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-2 sm:p-6">
    <div class="card p-5 max-w-2xl w-full max-h-[85vh] flex flex-col" onClick=${e=>e.stopPropagation()}>
      <div class="flex items-center mb-2"><span class="font-bold text-sm">⏰ 定时任务</span>
        ${data&&(data.scheduler_online
          ?html`<span class="text-[9px] px-1.5 py-0.5 rounded-full border border-emerald-600 text-emerald-500 ml-2">调度器在线</span>`
          :html`<span class="text-[9px] px-1.5 py-0.5 rounded-full border border-yellow-600 text-yellow-500 ml-2" title=${data.hint||""}>调度器离线</span>`)}
        <button onClick=${onClose} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button></div>
      <div class="bg-black/20 rounded-lg p-3 mb-3 space-y-2">
        <div class="text-[11px] font-bold text-gray-400">➕ 新建定时任务</div>
        <input value=${name} onInput=${e=>setName(e.target.value)} placeholder="任务名称（如: 每日巡检）"
          class="w-full bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs outline-none focus:border-amber-500"/>
        <textarea value=${jprompt} onInput=${e=>setJprompt(e.target.value)} rows="2"
          placeholder="任务内容（如: 检查项目目录中的代码与日志, 输出巡检摘要报告）"
          class="w-full bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs outline-none focus:border-amber-500 resize-none"></textarea>
        <div class="flex items-center gap-2 text-xs flex-wrap">
          <select value=${timerType} onChange=${e=>setTimerType(e.target.value)}
            class="bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs">
            <option value="every" class="bg-gray-900">固定间隔(秒)</option>
            <option value="at" class="bg-gray-900">每天定点</option>
            <option value="cron" class="bg-gray-900">Cron 表达式</option>
          </select>
          ${timerType==="every"&&html`<input value=${every} onInput=${e=>setEvery(e.target.value)} type="number" min="5"
            class="w-24 bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs" placeholder="3600"/>`}
          ${timerType==="at"&&html`<input value=${atTime} onInput=${e=>setAtTime(e.target.value)} type="time"
            class="bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs"/>`}
          ${timerType==="cron"&&html`<input value=${cronExpr} onInput=${e=>setCronExpr(e.target.value)}
            class="w-40 bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs font-mono" placeholder="0 * * * *"/>`}
          <input value=${project} onInput=${e=>setProject(e.target.value)} placeholder="项目目录名(可选)"
            class="flex-1 min-w-[120px] bg-black/30 border border-gray-700 rounded px-2 py-1 text-xs"/>
          <label class="flex items-center gap-1 text-[11px] text-gray-400">
            <input type="checkbox" checked=${enabled} onChange=${e=>setEnabled(e.target.checked)} class="accent-amber-500"/>启用</label>
          <button onClick=${add} disabled=${!jprompt.trim()}
            class="px-3 py-1 rounded-lg text-xs ${jprompt.trim()?"bg-amber-600 hover:bg-amber-500 text-white":"bg-gray-700 text-gray-500"}">⏰ 创建</button>
        </div>
      </div>
      <div class="flex-1 overflow-auto space-y-1">
        ${data===null&&html`<div class="text-xs text-gray-500 blink">加载中…</div>`}
        ${data&&jobs.length===0&&html`<div class="text-xs text-gray-600 text-center mt-4">（暂无定时任务, 在上方创建）</div>`}
        ${jobs.map(j=>html`<div key=${j.id} class="flex items-center gap-2 text-xs bg-black/25 rounded-lg px-3 py-2">
          <span class="text-[9px] px-1.5 py-0.5 rounded-full border shrink-0 ${j.enabled?"border-amber-500 text-amber-500":"border-gray-600 text-gray-500"}" title="定时任务"> ${j.enabled?"运行中":"已停用"}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-gray-200 truncate font-semibold">${j.name||j.id}</span>
              <span class="text-[9px] text-cyan-500 shrink-0">${fmtTimer(j)}</span>
              ${j.project&&html`<span class="text-[9px] text-gray-500 shrink-0">项目： ${j.project}</span>`}
            </div>
            <div class="text-[10px] text-gray-500 truncate" title=${j.prompt}>${j.prompt}</div>
          </div>
          <button onClick=${()=>toggle(j.id)} class="text-[10px] px-2 py-1 rounded border border-gray-600 text-gray-400 hover:text-amber-400 hover:border-amber-500 shrink-0">${j.enabled?"⏸ 停用":"▶ 启用"}</button>
          <button onClick=${()=>del(j.id)} class="text-[10px] px-2 py-1 rounded border border-gray-600 text-gray-400 hover:text-rose-400 hover:border-rose-500 shrink-0"></button>
        </div>`)}
      </div>
      ${data&&!data.scheduler_online&&html`<div class="text-[10px] text-yellow-500 mt-2"> 调度器未运行:  <code class="text-cyan-400">python -m omni_agent schedule start</code> 启动调度器</div>`}
    </div>
  </div>`;
}

/* ---------- 变更文件列表弹窗 —— 本次对话中变更/新增的文件(屏蔽文件夹, 按变更时间倒序) ---------- */
function ChangesModal({onClose, files, since, until, notify}) {
  const [view, setView] = useState(null);

  const viewFile = async (f) => {
    const ext = (f.ext || "").toLowerCase();
    const srcUrl = `/api/preview?path=${encodeURIComponent(f.path)}${f.wd ? "&wd=" + encodeURIComponent(f.wd) : ""}`;
    if (["png", "jpg", "jpeg", "gif", "svg", "webp", "ico"].includes(ext)) { setView({name: f.name, kind: "image", src: srcUrl}); return; }
    if (["html", "htm", "pdf"].includes(ext)) { window.open(srcUrl, "_blank"); return; }
    if (AV_EXT[ext]) { setView({name: f.name, kind: AV_EXT[ext], src: srcUrl}); return; } /* 音视频统一预览 */
    if (TABLE_EXT.includes(ext)) {   /* 表格类型 -> 结构化表格渲染 */
      setView({name: f.name, kind: "loading"});
      const r = await post("/api/table_read", {path: f.path, wd: f.wd || ""});
      if (!r.ok) { setView({name: f.name, kind: "text", content: "[预览失败] " + (r.error || "表格读取失败")}); return; }
      setView({name: f.name, kind: "table", sheets: r.sheets, truncated: r.truncated}); return; }
    setView({name: f.name, kind: "loading"});
    const r = await post("/api/workspace_read", {path: f.path});
    if (!r.ok) { setView({name: f.name, kind: "text", content: "[预览失败] " + (r.error || "读取失败")}); return; }
    setView({name: r.name || f.name, kind: (ext === "md" || ext === "markdown") ? "markdown" : "text", content: r.content, truncated: r.truncated, path: f.path, wd: f.wd || ""});
  };

  const downloadUrl = (f) => `/api/download?path=${encodeURIComponent(f.path)}${f.wd ? "&wd=" + encodeURIComponent(f.wd) : ""}`;

  return html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-2 sm:p-6">
    <div class="card p-5 max-w-3xl w-full max-h-[88vh] flex flex-col" onClick=${e => e.stopPropagation()}>
      <div class="flex items-center mb-2">
        <span class="font-bold text-sm"> 变更文件</span>
        <span class="text-[9px] px-1.5 py-0.5 rounded-full border border-amber-600 text-amber-500 ml-2 shrink-0" title="上一交付物至当前交付物时间段内发生更新或新增的所有类型文件(不含文件夹); 悬停文件名可查看完整路径">交付时间窗</span>
        <span class="text-[10px] text-gray-500 ml-2">共 ${files.length} 个文件${since ? html` · ${since}` : ""}${until ? html` ～ ${until}` : ""}</span>
        <button onClick=${onClose} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button>
      </div>
      
      <div class="flex-1 overflow-auto space-y-0.5">
        ${files.length === 0 && html`<div class="text-xs text-gray-600 text-center mt-8">（该时间段内暂无更新或新增的文件）</div>`}
        ${files.map((f, i) => html`<div key=${i} class="flex items-center gap-2 text-xs bg-black/25 rounded-lg px-3 py-2 border border-transparent hover:border-gray-600">
          <span>${fileIcon(f.ext)}</span>
          <span class="text-gray-200 truncate flex-1" title=${"完整路径: "+(f.full_path||((f.wd?f.wd+"/":"")+f.path))}>${f.path}</span>
          ${f.artifact && html`<span class="text-[9px] px-1.5 rounded-full border border-emerald-700 text-emerald-500 truncate max-w-[140px] shrink-0" title=${"所属交付物: " + f.artifact}> ${f.artifact}</span>`}
          <span class="text-gray-600 shrink-0">${fmtSize(f.size)}</span>
          <span class="text-gray-600 shrink-0 text-[10px]">${f.mtime_str}</span>
          <span class="flex gap-1.5 shrink-0">
            ${f.previewable
              ? html`<button onClick=${() => viewFile(f)} class="px-2 py-1 rounded-lg border border-gray-600 text-gray-300 hover:border-cyan-500 text-[11px]">👁 预览</button>`
              : html`<a href=${downloadUrl(f)} download=${f.name} class="px-2 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-cyan-500 text-[11px]">⬇ 下载</a>`}
          </span>
        </div>`)}
      </div>
      ${view && html`<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-2 sm:p-6">
        <div class="card p-4 max-w-4xl w-full max-h-[85vh] flex flex-col" onClick=${e => e.stopPropagation()}>
          <div class="flex items-center gap-2 mb-3">
            <span class="font-bold text-sm text-gray-200 truncate">👁 ${view.name}</span>
            <button onClick=${() => setView(null)} class="ml-auto px-3 py-1 rounded-lg border border-gray-700 text-gray-400 hover:border-rose-500 text-xs">✕ 关闭</button>
          </div>
          <div class="flex-1 overflow-auto rounded-lg ${view.kind === "markdown" ? "bg-white border border-gray-200" : "bg-black/30"} p-2">
            ${view.kind === "loading" && html`<div class="text-sm text-gray-500 blink mt-4 text-center">加载中…</div>`}
            ${view.kind === "image" && html`<img src=${view.src} class="max-w-full max-h-[70vh] object-contain rounded mx-auto" alt=${view.name} />`}
            ${view.kind === "text" && html`<pre class="text-xs text-gray-300 leading-relaxed">${view.content}</pre>`}
            ${view.kind === "markdown" && html`<${MdPane} name=${view.name} path=${view.path} wd=${view.wd||""} content=${view.content} truncated=${view.truncated} notify=${notify}/>`}
            ${view.kind === "table" && html`<${TableView} sheets=${view.sheets} truncated=${view.truncated}/>`}
            ${view.kind === "audio" && html`<audio controls src=${view.src} class="w-full mt-6"></audio>`}
            ${view.kind === "video" && html`<video controls src=${view.src} class="max-w-full max-h-[70vh] rounded mx-auto"></video>`}
          </div>
          ${view.truncated && html`<div class="text-[10px] text-yellow-500 mt-1">内容较长, 仅展示前 60000 字符</div>`}
        </div>
      </div>`}
    </div>
  </div>`;
}

/* ---------- 飞书配置弹窗(webhook推送 + 应用凭证, 持久化到 settings.json) ---------- */
function FeishuModal({onClose,notify}){

  useEffect(()=>{post("/api/feishu",{action:"get"}).then(r=>{
    if(r.ok&&r.feishu){setUrl(r.feishu.url||"");setAppId(r.feishu.app_id||"");setAppSecret(r.feishu.app_secret||"")}
    setLoaded(true)}).catch(()=>setLoaded(true))},[]);
  const save=async()=>{
    setSaving(true);

        <label class="text-xs text-gray-400">App Secret（可选）</label>

        <div class="flex gap-2 justify-end">

  </div>`;
}

/* ---------- MCP 服务配置弹窗(stdio + HTTP 双协议 + 白屏修复) ---------- */
function McpModal({onClose,notify,busy}){
  const [servers,setServers]=useState(null);
  const [transport,setTransport]=useState("stdio");
  const [name,setName]=useState("");
  const [command,setCommand]=useState("");
  const [argsStr,setArgsStr]=useState("");
  const [envStr,setEnvStr]=useState("");
  const [url,setUrl]=useState("");
  const [headersStr,setHeadersStr]=useState("");
  const [testing,setTesting]=useState(false);
  const [saving,setSaving]=useState(false);
  const [testResult,setTestResult]=useState(null);
  const load=()=>api("/api/mcp").then(r=>setServers(r.servers||[])).catch(()=>setServers([]));
  useEffect(()=>{load()},[]);   // v5.2白屏修复: load返回Promise, 直接传给useEffect会被React当cleanup函数调用, 关闭弹窗卸载组件时抛异常导致整树崩溃白屏
  const parseArgs=()=>argsStr.split(/\s+/).filter(Boolean);
  const parseEnv=()=>{const o={};envStr.split(/[\n;]+/).forEach(kv=>{const i=kv.indexOf("=");
    if(i>0)o[kv.slice(0,i).trim()]=kv.slice(i+1).trim()});return o};
  const parseHeaders=()=>{const o={};headersStr.split(/[\n;]+/).forEach(kv=>{const i=kv.indexOf(":");
    if(i>0)o[kv.slice(0,i).trim()]=kv.slice(i+1).trim()});return o};
  const buildPayload=()=>({transport,name:name.trim(),
    command:command.trim(),args:parseArgs(),env:parseEnv(),
    url:url.trim(),headers:parseHeaders()});
  const doTest=async()=>{
    if(!name.trim()){notify("请先填写名称",true);return}
    if((transport==="http"||transport==="sse")&&!url.trim()){notify(transport.toUpperCase()+" 协议需填写 Remote URL",true);return}
    if(transport==="stdio"&&!command.trim()){notify("stdio 协议需填写启动命令",true);return}
    setTesting(true);setTestResult(null);
    const r=await post("/api/mcp",{action:"test",...buildPayload()}).catch(e=>({ok:false,error:String(e)}));
    setTesting(false);setTestResult(r);
    notify(r.ok?("✓ "+r.msg):(r.error||"验证失败"),!r.ok);
  };
  const doSave=async()=>{
    if(!name.trim()){notify("请先填写名称",true);return}
    if((transport==="http"||transport==="sse")&&!url.trim()){notify(transport.toUpperCase()+" 协议需填写 Remote URL",true);return}
    if(transport==="stdio"&&!command.trim()){notify("stdio 协议需填写启动命令",true);return}
    if(busy){notify("任务执行中, 请稍后再保存",true);return}
    setSaving(true);
    const r=await post("/api/mcp",{action:"save",...buildPayload()}).catch(e=>({ok:false,error:String(e)}));
    setSaving(false);notify(r.msg||r.error,!r.ok);
    if(r.ok){setName("");setCommand("");setArgsStr("");setEnvStr("");
      setUrl("");setHeadersStr("");setTestResult(null);setServers(r.servers||[])}
  };
  const doDel=async n=>{
    if(!confirm("确认删除 MCP Server「"+n+"」？其注册工具将同时下线"))return;
    const r=await post("/api/mcp",{action:"delete",name:n}).catch(e=>({ok:false,error:String(e)}));
    notify(r.msg||r.error,!r.ok);if(r.ok)setServers(r.servers||[]);
  };
  const fillEdit=sv=>{
    setName(sv.name);
    const tp=sv.transport||("url"in sv&&sv.url?"http":"stdio");
    setTransport(tp);
    setCommand(sv.command||"");
    setArgsStr((sv.args||[]).join(" "));
    setEnvStr(Object.entries(sv.env||{}).map(([k,v])=>k+"="+v).join("\n"));
    setUrl(sv.url||"");
    setHeadersStr(Object.entries(sv.headers||{}).map(([k,v])=>k+":"+v).join("\n"));
    setTestResult(null);
  };
  const resetFields=()=>{setCommand("");setArgsStr("");setEnvStr("");
    setUrl("");setHeadersStr("");setTestResult(null)};

  return html`<div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="card p-6 w-[560px] max-h-[88vh] overflow-y-auto" onClick=${e=>e.stopPropagation()}>
      <div class="font-bold mb-1"> 三方 MCP 服务配置</div>
       
      <div class="mb-4">
        <div class="text-xs font-bold text-gray-400 mb-1.5">已配置服务</div>
        ${servers===null&&html`<div class="text-xs text-gray-500 blink">加载中…</div>`}
        ${servers&&servers.length===0&&html`<div class="text-xs text-gray-600 bg-black/25 rounded-lg px-3 py-2">（暂无 MCP 服务, 在下方添加）</div>`}
        ${(servers||[]).map(sv=>{
          const tp=sv.transport||("url"in sv&&sv.url?"http":"stdio");
          const isRemote=tp==="http"||tp==="sse";
          return html`<div key=${sv.name} class="flex items-center gap-2 text-xs bg-black/25 rounded-lg px-3 py-2 mb-1">
            <span class=${"w-2 h-2 rounded-full flex-none "+(sv.connected?"bg-emerald-500":"bg-rose-500")}
              title=${sv.connected?"已连接":"未连接"}></span>
            <span class="font-bold text-gray-200">${sv.name}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${tp==="http"?"bg-blue-900/40 text-blue-300":tp==="sse"?"bg-violet-900/40 text-violet-300":"bg-gray-700 text-gray-300"}">${tp==="http"?"HTTP":tp==="sse"?"SSE":"stdio"}</span>
            <span class="text-gray-500 font-mono truncate flex-1" title=${isRemote?sv.url:sv.command+" "+(sv.args||[]).join(" ")}>
              ${isRemote?(sv.url||""):(sv.command+" "+(sv.args||[]).join(" "))}</span>
            <span class=${sv.connected?"text-emerald-400":"text-rose-400"}>
              ${sv.connected?("✓ "+sv.tool_count+" 工具"):" 离线"}</span>
            <button onClick=${()=>fillEdit(sv)} class="text-cyan-500 hover:text-cyan-300">编辑</button>
            <button onClick=${()=>doDel(sv.name)} class="text-rose-500 hover:text-rose-300">删除</button>
          </div>`})}
      </div>
      <div class="text-xs font-bold text-gray-400 mb-1.5">添加 / 修改服务</div>
      <div class="flex gap-2 mb-3">
        ${["stdio","http","sse"].map(tp=>html`
          <button onClick=${()=>{setTransport(tp);resetFields()}}
            class=${"px-3 py-1.5 rounded-lg text-xs font-medium border transition "+
              (transport===tp?"border-cyan-500 bg-cyan-600/20 text-cyan-300":"border-gray-700 text-gray-400 hover:border-gray-500")}>
            ${tp==="stdio"?"🖥 本地进程(stdio)":tp==="http"?"🌐 云端服务(HTTP)":"📡 SSE 长连接"}
          </button>`)}
      </div>
      ${transport==="sse"&&html`<div class="text-[10px] text-blue-400 bg-blue-900/20 rounded-lg px-3 py-1.5 mb-2">📡 SSE(Server-Sent Events)：适配仅支持 SSE 端点的云端 MCP Server，长连接流式响应，支持 Mcp-Session-Id 会话保持与自定义鉴权 Header。</div>`}
      <label class="text-xs text-gray-400">服务名称（唯一标识, 如 filesystem / my-api）</label>
      <input value=${name} onInput=${e=>setName(e.target.value)} placeholder="my-mcp-server"
        class="w-full mt-1 mb-2.5 bg-black/30 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-500"/>

      ${(transport==="http"||transport==="sse")?html`
        <label class="text-xs text-gray-400">Remote URL（${transport==="sse"?"SSE 端点地址":"云端 MCP Server 地址"}）</label>
        <input value=${url} onInput=${e=>setUrl(e.target.value)} placeholder="https://mcp.example.com/sse"
          class="w-full mt-1 mb-2.5 bg-black/30 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-500 font-mono"/>
        <label class="text-xs text-gray-400">自定义请求头（每行一条 Header:Value, 可选, 用于鉴权等）</label>
        <textarea value=${headersStr} onInput=${e=>setHeadersStr(e.target.value)} rows="2" placeholder="Authorization: Bearer eyJhbG..."
          class="w-full mt-1 mb-3 bg-black/30 border border-gray-700 rounded-lg px-3 py-2 text-xs outline-none focus:border-cyan-500 font-mono resize-none"></textarea>
      `:html`
        <label class="text-xs text-gray-400">启动命令（可执行程序, 如 npx / python3 / uvx）</label>
        <input value=${command} onInput=${e=>setCommand(e.target.value)} placeholder="npx"
          class="w-full mt-1 mb-2.5 bg-black/30 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-500"/>
        <label class="text-xs text-gray-400">参数（空格分隔, 可选）</label>
        <input value=${argsStr} onInput=${e=>setArgsStr(e.target.value)} placeholder="-y @modelcontextprotocol/server-filesystem /tmp"
          class="w-full mt-1 mb-2.5 bg-black/30 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-500 font-mono"/>
        <label class="text-xs text-gray-400">环境变量（每行一条 KEY=VALUE, 可选）</label>
        <textarea value=${envStr} onInput=${e=>setEnvStr(e.target.value)} rows="2" placeholder="API_TOKEN=xxx"
          class="w-full mt-1 mb-3 bg-black/30 border border-gray-700 rounded-lg px-3 py-2 text-xs outline-none focus:border-cyan-500 font-mono resize-none"></textarea>
      `}

      ${testResult&&html`<div class=${"text-xs rounded-lg px-3 py-2 mb-3 "+(testResult.ok?"bg-emerald-900/40 text-emerald-300":"bg-rose-900/40 text-rose-300")}>
        ${testResult.ok?html`✓ ${testResult.msg}${testResult.tools&&testResult.tools.length?html`<div class="mt-1 text-[10px] text-emerald-400/80 font-mono">${testResult.tools.join(" · ")}</div>`:""}`:(" "+testResult.error)}
      </div>`}
      <div class="flex gap-2 justify-end">
        <button onClick=${onClose} class="px-4 py-1.5 rounded-lg border border-gray-700 text-sm">关闭</button>
        <button disabled=${testing} onClick=${doTest}
          class="px-4 py-1.5 rounded-lg border border-cyan-600 text-cyan-400 hover:bg-cyan-600/20 text-sm ${testing?"opacity-50":""}">${testing?"验证中…":"⚡ 验证可用性"}</button>
        <button disabled=${saving} onClick=${doSave}
          class="px-4 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-sm ${saving?"opacity-50":""}">${saving?"保存中…":"保存生效"}</button>
      </div>
    </div>
  </div>`;
}

/* 通用模型选择器 —— 下拉直选模型管理中已登记的模型, 兼顾自定义输入(通用兜底) */
function ModelSelect({value,onChange,pool,allowEmpty,emptyLabel,ph}){

      ${allowEmpty?html`<option value="">${emptyLabel||"（不启用）"}</option>`:(!value&&!custom&&html`<option value="">（请选择模型）</option>`)}
      ${(pool||[]).map(m=>html`<option key=${m.name} value=${m.name}>${m.name}</option>`)}
      <option value="__custom__">✍ 自定义输入…</option>

function ConfigModal({onClose,state,refresh,notify}){
  const pool=(state&&state.pool)||[];
  /* 角色分配: 主/备用/视觉 从模型管理直选, 无需二次填写端点 */
  const [model,setModel]=useState((state&&state.model)||"");
  const [fbModel,setFbModel]=useState((state&&state.fallback_model)||"");
  const [vModel,setVModel]=useState((state&&state.vision_model)||"");
  /* 全局默认端点(池中未独立配置端点的模型继承此处) */

  const save=async()=>{
    if(!model.trim()){notify("请先选择或填写主模型",true);return}

    const r=await post("/api/config",body).catch(e=>({ok:false,error:String(e)}));
    setSaving(false);
    if(r&&r.ok){notify("✓ 模型配置已保存生效"+(persist?"（已持久化，重启仍有效）":"（仅本次运行有效）"));onClose();refresh()}

  return html`<div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" >
    <div class="card p-6 w-[880px] max-w-[95vw] max-h-[90vh] overflow-y-auto" onClick=${e=>e.stopPropagation()}>
      <div class="font-bold mb-1"> 大模型接入配置</div>

          ${pool.map(m=>html`<div key=${m.name} class="flex items-center gap-2 px-3 py-1.5 text-xs">

            <button onClick=${()=>setNp({name:m.name,base_url:m.base_url||"",api_key:""})} title="填入下方表单编辑（Key 留空保持不变）"
              class="text-[10px] text-cyan-500 hover:text-cyan-400 shrink-0">✎ 编辑</button>

        </div>

          <button disabled=${busyPool} onClick=${addModel}

        </div>
         
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        <div class="rounded-xl border border-cyan-800/60 bg-cyan-950/20 p-3">
          <div class="text-xs font-bold text-cyan-400 mb-1">主模型</div>
          <div class="text-[10px] text-gray-500 mb-2">当前: <span class="text-violet-300">${state?state.model:"-"}</span>${state&&state.api_key_set?html` <span class="text-emerald-400">✓</span>`:""}</div>
          <${ModelSelect} value=${model} onChange=${setModel} pool=${pool} ph="qwen3-max"/>
           
        </div>

          <${ModelSelect} value=${fbModel} onChange=${setFbModel} pool=${pool} allowEmpty emptyLabel="（不启用兜底）" ph="qwen-plus"/>

      <div class="rounded-xl border border-slate-700/60 bg-slate-900/10 p-4 mb-4">
        <div class="flex items-center gap-3 mb-1">
