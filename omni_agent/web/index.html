          <label class="flex items-center gap-1.5 text-[11px] text-gray-400"><input type="checkbox" checked=${!!(state&&state.routing&&state.routing.enabled!==false)} onChange=${e=>post("/api/config",{routing_enabled:e.target.checked,persist:true}).then(()=>refresh())}/> 启用</label>
        </div>
         
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
          <div><div class="text-[10px] text-gray-400 mb-1">轻量场景</div><${ModelSelect} value=${rtLight} onChange=${setRtLight} pool=${pool} allowEmpty emptyLabel="主模" ph="qwen3-turbo"/></div>
          <div><div class="text-[10px] text-gray-400 mb-1">编程模式</div><${ModelSelect} value=${rtCode} onChange=${setRtCode} pool=${pool} allowEmpty emptyLabel="主模" ph="qwen3-coder-plus"/></div>
          <div><div class="text-[10px] text-gray-400 mb-1">长程对话</div><${ModelSelect} value=${rtLong} onChange=${setRtLong} pool=${pool} allowEmpty emptyLabel="主模" ph="qwen3-long-context"/></div>
        </div>
      </div>
      <div class="flex items-center gap-3">
         
        <span class="flex-1"></span>
        <button onClick=${onClose} class="px-4 py-1.5 rounded-lg border border-gray-700 text-sm">取消</button>
        <button disabled=${saving} onClick=${save}
          class="px-4 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-sm ${saving?"opacity-50":""}">${saving?"保存中…":"保存生效"}</button>
      </div>
    </div>
  </div>`;
}

/* ---------- 错误边界 —— 任何子组件渲染/卸载异常仅局部降级, 不再整页白屏 ---------- */
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(err){return {err}}
  componentDidCatch(err,info){console.error("[ErrorBoundary]",err,info&&info.componentStack)}
  render(){
    if(this.state.err)return html`<div class="fixed bottom-4 right-4 z-[99] card p-3 text-xs text-rose-500 max-w-sm">
       组件渲染异常已隔离: ${String(this.state.err&&this.state.err.message||this.state.err)}
      <button class="ml-2 underline" onClick=${()=>this.setState({err:null})}>关闭</button></div>`;
    return this.props.children;
  }
}

/* ---------- 主应用 ---------- */
function App(){
  const [state,setState]=useState(null);
  const [domain,setDomain]=useState(null);   /* 垂直领域异构路由徽章 */
  const [items,setItems]=useState([]);       // 渲染时间线
  const [busy,setBusy]=useState(false);
  const [prompt,setPrompt]=useState("");
  const [showCfg,setShowCfg]=useState(false);
  const [showFeishu,setShowFeishu]=useState(false);   // 飞书配置弹窗
  const [showMcp,setShowMcp]=useState(false);         // MCP 服务配置弹窗
  /* 输入框工具多选列表(默认全部勾选; 取消勾选的工具进入任务级黑名单) */
  const [toolSel,setToolSel]=useState({});      // name -> bool
  const [showToolMenu,setShowToolMenu]=useState(false);
  const [cost,setCost]=useState(null);
  const [chain,setChain]=useState([]);      /* 工具调用链路可视化 */
  const [todos,setTodos]=useState(null);
  const [artifacts,setArtifacts]=useState([]);   // 成果物历史(右侧面板)
  const [snapMap,setSnapMap]=useState({});   // 交付物快照状态 art_id -> "pending"|快照ID
  const [preview,setPreview]=useState(null);     // 预览弹窗状态
  const [showMem,setShowMem]=useState(false);
  const [showSkills,setShowSkills]=useState(false);
  const [showEnv,setShowEnv]=useState(false);
  const [showSched,setShowSched]=useState(false);  /* 定时任务弹窗 */
  const [showFiles,setShowFiles]=useState(false);   // 文件管理弹窗
  const [mobilePanel,setMobilePanel]=useState(null); // 移动端抽屉(sess|status)
  const [showWorkspace,setShowWorkspace]=useState(false);  // 工作空间弹窗
  const [showChanges,setShowChanges]=useState(false);  // 变更文件弹窗
  const [changesData,setChangesData]=useState(null);  // {files, since}
  const [srcExpand,setSrcExpand]=useState(false);
  const [attachments,setAttachments]=useState([]);
  const [fileRefs,setFileRefs]=useState([]);   // 文件管理导入的引用文件(含绝对路径, 卡片展示)
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef(null);
  const nextRef=useRef(0);
  const bottomRef=useRef(null);
  const itemsRef=useRef([]);

  const pushItem=useCallback(it=>{itemsRef.current=[...itemsRef.current,it];setItems(itemsRef.current)},[]);
  const patchLast=useCallback((type,fn)=>{
    const arr=[...itemsRef.current];
    for(let i=arr.length-1;i>=0;i--){if(arr[i].kind===type){arr[i]=fn(arr[i]);break}}
    itemsRef.current=arr;setItems(arr);
  },[]);
  /* 按 sid 定位 Swarm 卡片并更新(树状实时刷新) */
  const patchSwarm=useCallback((sid,fn)=>{
    const arr=[...itemsRef.current];
    for(let i=arr.length-1;i>=0;i--){if(arr[i].kind==="swarm"&&arr[i].sid===sid){arr[i]=fn(arr[i]);break}}
    itemsRef.current=arr;setItems(arr);
  },[]);

  const refresh=useCallback(()=>api("/api/state").then(s=>{setState(s);setBusy(s.busy);setCost(s.cost);setTodos(s.todos);setArtifacts(s.artifacts||[])}),[]);
  /* 左侧会话列表刷新信号 —— 服务端 sessions 事件(任务名固化/任务结束)触发自增 */
  const [sessVer,setSessVer]=useState(0);

  /* 工具勾选状态持久化 —— 刷新页面后从 localStorage 恢复之前的选择;
     新增工具默认勾选, 不覆盖用户已取消项; 新建会话时重置为全选 */
  const TOOLSEL_KEY="haisnap_tool_sel";
  const saveToolSel=useCallback(sel=>{try{localStorage.setItem(TOOLSEL_KEY,JSON.stringify(sel))}catch(_){}},[]);
  const setToolSelPersist=useCallback(updater=>{
    setToolSel(prev=>{const n=typeof updater==="function"?updater(prev):updater;saveToolSel(n);return n});
  },[saveToolSel]);
  useEffect(()=>{
    if(!state||!state.tools)return;
    setToolSel(prev=>{
      let saved={};
      try{saved=JSON.parse(localStorage.getItem(TOOLSEL_KEY)||"{}")}catch(_){}
      const n={...prev};
      for(const t of state.tools){
        if(!(t.name in n))n[t.name]=(t.name in saved)?saved[t.name]:true;
      }
      saveToolSel(n);
      return n});
  },[state]);

  /* v4.0 初始化顺序修复(消息重复BUG): 先取 state 定位事件游标(nextRef),
     再回放历史时间线, 最后才启动事件长轮询。
     旧版轮询与 refresh 并发启动, since=0 会把全部历史事件重放一遍,
     与 /api/history 回放叠加导致刷新后最后一条消息出现两次。 */
  useEffect(()=>{
    let stop=false,es=null;
    (async()=>{
      try{
        const s=await api("/api/state");
        setState(s);setBusy(s.busy);setCost(s.cost);setTodos(s.todos);setArtifacts(s.artifacts||[]);
        nextRef.current=s.event_count;   // 事件游标先行定位: 历史事件不再重放
      }catch(_){}
      try{
        const h=await api("/api/history");
        const restored=[];
        for(const m of (h.items||[])){
          if(m.kind==="user")restored.push({kind:"user",text:m.text});
          else if(m.kind==="steer")restored.push({kind:"steer",text:m.text,acked:true});
          else if(m.kind==="reasoning")restored.push({kind:"reasoning",text:m.text,closed:true}); /* 历史回放恢复思考内容 */
          else if(m.kind==="assistant")restored.push({kind:"assistant",text:m.text,closed:true});
          else if(m.kind==="tool")restored.push({kind:"tool",start:{tool:m.tool,title:m.title,brief:m.brief,dt:m.dt},end:{result:m.result,dt:m.dt,title:m.title}});
        }
        if(restored.length){restored.push({kind:"sys",text:"—— 以上为该会话的历史执行记录 ——"});itemsRef.current=restored;setItems(restored)}
      }catch(_){}
      /* 改用 SSE 单一持久连接(EventSource)服务端推流 —— 只建立一次
         连接不再反复发请求, 彻底修复平台反代将长轮询重连判定为频繁访问的403 */
      const connect=()=>{
        if(stop) return;
        es=new EventSource(`/api/stream?since=${nextRef.current}`);
        es.onmessage=ev=>{try{const r=JSON.parse(ev.data);nextRef.current=r.next;for(const e of r.events) handle(e)}catch(_){}};
        es.onerror=()=>{es.close();if(!stop) setTimeout(connect,15000)};
      };
      connect();
    })();
    return ()=>{stop=true;if(es)es.close()};
  },[]);

  /* 文件预览分发: HTML/PDF新窗口 · 图片音视频弹窗 · md富渲染 · 文本弹窗 · 其余仅下载 */
  const previewFile=useCallback(async f=>{
    const ext=(f.ext||"").toLowerCase();
    const src=fileUrl("preview",f);
    if(NEWTAB_EXT.includes(ext)){window.open(src,"_blank");return}
    if(IMG_EXT.includes(ext)){setPreview({kind:"image",src,name:f.name,path:f.path,wd:f.wd,ext});return}
    if(AV_EXT[ext]){setPreview({kind:AV_EXT[ext],src,name:f.name,path:f.path,wd:f.wd,ext});return}
    if(TABLE_EXT.includes(ext)){   /* 表格类型 -> 结构化表格渲染 */
      setPreview({kind:"loading",name:f.name,path:f.path,wd:f.wd,ext});
      const r=await post("/api/table_read",{path:f.path,wd:f.wd||""});
      if(!r.ok){setPreview({kind:"text",content:"[预览失败] "+(r.error||"表格读取失败"),name:f.name,path:f.path,wd:f.wd,ext});return}
      setPreview({kind:"table",sheets:r.sheets,truncated:r.truncated,name:f.name,path:f.path,wd:f.wd,ext});return}
    if(!TEXT_EXT.includes(ext)){   // 不支持在线预览的类型 -> 直接触发下载
      const a=document.createElement("a");a.href=fileUrl("download",f);a.download=f.name;a.click();return}
    setPreview({kind:"loading",name:f.name,path:f.path,wd:f.wd,ext});
    try{
      const r=await fetch(src);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const t=await r.text();
      const kind=(ext==="md"||ext==="markdown")?"markdown":"text";
      setPreview({kind,content:t.slice(0,60000),truncated:t.length>60000,name:f.name,path:f.path,wd:f.wd,ext});
    }catch(err){setPreview({kind:"text",content:"[预览失败] "+err.message,name:f.name,path:f.path,wd:f.wd,ext})}
  },[]);

  /* v7.3 修复: loadChanges 原被误注入 handle() 内部 —— 导致渲染期
     ReferenceError: loadChanges is not defined(App 整树崩溃), 且 useCallback
     在非渲染期被调用抛 Invalid hook call 并被静默吞掉, SSE 事件流全部中断。
     现提升至组件作用域, handle 恢复纯事件分发。 */
  const loadChanges=useCallback(async(artId)=>{
    try{ const url="/api/changes"+(artId?"?art_id="+encodeURIComponent(artId):""); const r=await api(url); setChangesData(r); }
    catch(_){ setChangesData({ok:false,files:[],error:"网络错误"}); }
    setShowChanges(true);
  },[]);

  function handle(e){
    switch(e.type){
      case "task_start": setBusy(true); setChain([]); {let _p=(e.prompt||"").replace(/\n\[系统提示:[^\]]*\]\s*$/,"");
        /* 防御性截断 —— 领域引擎策略/系统提示不应出现在用户气泡内 */
        for(const _m of ["\n[系统提示:","\n【垂直领域异构执行引擎"]){const _i=_p.indexOf(_m); if(_i>0)_p=_p.slice(0,_i);}
        pushItem({kind:"user",text:_p.trimEnd()});} break;
      case "policy": pushItem({kind:"policy",text:e.desc}); break;
      case "reasoning": {
        const last=itemsRef.current[itemsRef.current.length-1];
        if(last&&last.kind==="reasoning"&&!last.closed) patchLast("reasoning",it=>({...it,text:it.text+e.text}));
        else pushItem({kind:"reasoning",text:e.text}); break;}
      case "content": {
        const last=itemsRef.current[itemsRef.current.length-1];
        if(last&&last.kind==="assistant"&&!last.closed) patchLast("assistant",it=>({...it,text:it.text+e.text}));
        else pushItem({kind:"assistant",text:e.text}); break;}
      /* 回答已结束、模型正在生成工具调用参数 —— 关闭末尾 assistant 流,
         使 loading 标识立即显示(修复思考结束后→工具展示前的无指示空窗) */
      case "toolgen": patchLast("assistant",it=>({...it,closed:true})); break;
      case "discard": { /* 备用模型接管时废弃主模型半途流式内容, 防重复叠加 */
        const arr=itemsRef.current; const last=arr[arr.length-1];
        if(last&&((last.kind==="assistant"&&!last.closed)||(last.kind==="reasoning"&&!last.closed))){
          itemsRef.current=arr.slice(0,-1);setItems(itemsRef.current);
        }
        break; }
      case "tool_start": pushItem({kind:"tool",start:e,end:null});
        setChain(c=>[...c,{kind:"node",tool:e.tool,title:e.title||e.tool,brief:e.brief,status:"running",
          at:new Date((e.ts?e.ts*1000:Date.now())).toLocaleTimeString("zh-CN",{hour12:false})}]); break;
      case "tool_end": patchLast("tool",it=>({...it,end:e}));
        setChain(c=>{const a=[...c];for(let i=a.length-1;i>=0;i--){if(a[i].kind==="node"&&a[i].status==="running"){
          const bad=/^\[(错误|失败|已拒绝|超时|工具执行异常|被 PreToolUse)/.test(e.result||"");
          a[i]={...a[i],status:bad?"error":"ok",dt:e.dt};break}}return a}); break;
      /* ---- Swarm 树状事件 ---- */
      case "swarm_start": pushItem({kind:"swarm",sid:e.sid,done:false,
        tasks:(e.tasks||[]).map(t=>({task:t,status:"pending",tools:[],output:""}))}); break;
      case "swarm_task_start": patchSwarm(e.sid,it=>{const ts=[...it.tasks];
        if(ts[e.idx])ts[e.idx]={...ts[e.idx],status:"running"};return {...it,tasks:ts}}); break;
      case "swarm_tool": patchSwarm(e.sid,it=>{const ts=[...it.tasks];
        if(ts[e.idx])ts[e.idx]={...ts[e.idx],tools:[...ts[e.idx].tools,{tool:e.tool,brief:e.brief,dt:e.dt,result:e.result}]};
        return {...it,tasks:ts}}); break;
      case "swarm_task_done": patchSwarm(e.sid,it=>{const ts=[...it.tasks];
        if(ts[e.idx])ts[e.idx]={...ts[e.idx],status:e.failed?"failed":"done",output:e.output||"",partial:!!e.partial};
        return {...it,tasks:ts}}); break;
      case "swarm_end": patchSwarm(e.sid,it=>({...it,done:true})); break;
      case "turn": setChain(c=>[...c,{kind:"turn",n:e.turn}]); break;
      case "todos": setTodos(e); break;
      case "approval": pushItem({kind:"approval",e}); break;
      case "question": pushItem({kind:"question",e}); break;
      case "notice": pushItem({kind:"notice",e}); break;
      case "reflexion": pushItem({kind:"reflexion",e}); break;   /* 自愈反思卡片 */
      /* 人机协同共驾 —— 发出的协同指令与智能体吸收确认 */
      case "steer": pushItem({kind:"steer",text:e.text,acked:false}); break;
      case "steer_ack": {const arr=[...itemsRef.current];
        for(let i=arr.length-1;i>=0;i--){if(arr[i].kind==="steer"&&!arr[i].acked){arr[i]={...arr[i],acked:true};break}}
        itemsRef.current=arr;setItems(arr);break;}
      case "domain": setDomain(e.id&&e.id!=="general"?e:null); break;  /* 领域路由 */
      case "artifacts": pushItem({kind:"artifacts",e}); setArtifacts(a=>[...a,e]); break;
      /* 快照完成定向回推 —— 按钮原位替换为快照ID(时间线卡片+右侧面板同步) */
      case "artifact_snapshot": {
        if(e.ok&&e.cid){
          setSnapMap(m=>({...m,[e.art_id]:e.cid}));
          setArtifacts(arr=>arr.map(a=>a.id===e.art_id?{...a,snapshot_id:e.cid}:a));
          const arr2=[...itemsRef.current];
          for(let i=arr2.length-1;i>=0;i--){
            if(arr2[i].kind==="artifacts"&&arr2[i].e&&arr2[i].e.id===e.art_id){
              arr2[i]={...arr2[i],e:{...arr2[i].e,snapshot_id:e.cid}};break}}
          itemsRef.current=arr2;setItems(arr2);
        }else setSnapMap(m=>{const n={...m};delete n[e.art_id];return n});
        break;}
      case "task_done": patchLast("assistant",it=>({...it,closed:true}));
        if(e.max_turns_reached) pushItem({kind:"maxturns",text:e.summary||("已达单任务最大轮次("+(e.max_turns||100)+")，任务未完成已暂停"),time:e.finished_at||""});
        else pushItem({kind:"done",text:e.summary||"",time:e.finished_at||new Date().toLocaleString("zh-CN",{hour12:false})}); break;
      case "task_error": pushItem({kind:"error",text:e.detail||"",resumable:!!e.resumable}); break;
      case "next_actions": { // 任务续航建议芯片(一键点击续跑)
        const acts=(e.actions||[]).filter(a=>a&&typeof a==="string");
        /* 去重防护 —— 最后一条已是 next_actions 时替换而非追加,
           修复同一任务连续推送两次建议块的问题 */
        if(acts.length){
          const arr=itemsRef.current; const last=arr[arr.length-1];
          if(last&&last.kind==="next_actions"){
            const merged=[...arr.slice(0,-1),{kind:"next_actions",actions:acts}];
            itemsRef.current=merged;setItems(merged);
          } else pushItem({kind:"next_actions",actions:acts});
        }
        break;
      }
      case "sys": pushItem({kind:"sys",text:e.text||""}); refresh();
        /* 手动中断时关闭所有 running 状态的工具卡片与时间线节点,
           避免中断后最后一个工具永远显示"执行中" */
        if(e.text&&(e.text.includes("终止")||e.text.includes("⏹"))){
          patchLast("tool",it=>({...it,end:{result:"[已终止] 用户手动终止了当前任务",dt:0}}));
          setChain(c=>{const a=c.map(n=>n.kind=="node"&&n.status=="running"
            ?{...n,status:"error",dt:0}:n);return a});
        }
        break;
      /* 会话切换/新建时后端定向推送信源列表 —— 数据溯源面板即时联动(无则清空) */
      case "sources": setState(s=>s?{...s,sources:e.sources||[]}:s); setSrcExpand(false); break;
      case "sessions": setSessVer(v=>v+1); refresh(); break;   /* 任务名固化后同步刷新顶栏工作目录与状态 */
      case "cost": setCost(e); break;
      case "idle": setBusy(false); refresh(); setSessVer(v=>v+1); break;
      default: break;   /* 未知事件类型忽略, 不报错 */
    }
    setTimeout(()=>bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"}),50);
  }

  /* 基于输入框工具多选构建策略 —— 默认全选=不限制; 取消勾选项进入黑名单 */
  function buildPolicy(){
    const names=(state&&state.tools||[]).map(t=>t.name);
    const deny=names.filter(n=>toolSel[n]===false);
    if(!deny.length) return null;
    return {mode:"manual",deny};
  }

  /* '/' 斜杠快捷命令系统(与 CLI 会话命令对齐) —— 输入 / 唤起菜单,
     ↑↓选择 / Tab补全 / Enter执行 / Esc取消; 未知 /xxx 仍作为普通任务提交(同CLI) */
  const SLASH_CMDS=[
    {c:"/help",d:"显示全部斜杠命令帮助"},
    {c:"/clear",d:"清空会话历史(保留系统提示与记忆)"},
    {c:"/compact",d:"上下文压缩已移除; 文件备份采用自动快照机制(交付时固化, 部署/预览指向快照目录)"},
    {c:"/cost",d:"查看 Token 消耗统计"},
    {c:"/memory",d:"查看项目记忆与跨会话全局记忆"},
    {c:"/sources",d:"查看本会话登记的信源列表"},
    {c:"/sessions",d:"列出历史会话(置顶优先)"},
    {c:"/session new",d:"新建会话"},
    {c:"/tools",d:"打开工具多选面板(启用/禁用工具)"},
    {c:"/mode checklist",d:"切换到计划模式: 复杂任务先列计划逐步执行"},
    {c:"/mode auto",d:"切换到探索模式: 自由决定执行路径直至交付"},
    {c:"/mode chat",d:"切换到对话模式: 直接文本回复"},
    {c:"/thinking on",d:"开启 thinking 思考模式"},
    {c:"/thinking off",d:"关闭 thinking 思考模式"},
    {c:"/checkpoint create",d:"创建工作区快照(可追加备注: /checkpoint create 备注)"},
    {c:"/checkpoint switch",d:"回滚到指定快照(/checkpoint switch <ID>)"},
    {c:"/checkpoints",d:"列出项目快照(内容寻址去重存储)"},
    {c:"/skills",d:"打开技能管理面板(启用/安装/卸载)"},
    {c:"/env",d:"打开配置中心(配置诊断+用户级覆盖)"},
    {c:"/files",d:"打开本地文件管理"},
    {c:"/workspace",d:"打开工作空间(任务工作目录)"},
    {c:"/mcp",d:"打开 MCP 服务配置"},
    {c:"/settings",d:"打开配置中心(配置诊断+用户级覆盖)"}];
  const SLASH_HEADS=new Set(SLASH_CMDS.map(x=>x.c.split(" ")[0]));
  const [slashIdx,setSlashIdx]=useState(0);
  const slashQuery=(prompt.startsWith("/")&&!prompt.includes("\n"))?prompt.toLowerCase():null;
  const slashMatches=slashQuery?SLASH_CMDS.filter(x=>x.c.startsWith(slashQuery.trimEnd())):[];
  const sIdx=Math.min(slashIdx,Math.max(0,slashMatches.length-1));
  async function runSlash(line){
    const raw=(line||"").trim();
    const parts=raw.split(/\s+/);const head=(parts[0]||"").toLowerCase();const rest=parts.slice(1);const arg=rest.join(" ");
    setPrompt("");setSlashIdx(0);
    if(head==="/help"){pushItem({kind:"sys",text:"⌨ 斜杠快捷命令(与 CLI 一致):\n"+SLASH_CMDS.map(x=>"  "+x.c+"  —— "+x.d).join("\n")});return}
    if(head==="/clear"){await cmd("clear");itemsRef.current=[];setItems([]);return}
    if(head==="/compact")return cmd("compact");
    if(head==="/cost")return cmd("cost");
    if(head==="/memory"){setShowMem(true);return}
    if(head==="/sources")return cmd("sources");
    if(head==="/sessions")return cmd("sessions");
    if(head==="/session"){
      if(arg==="new"){
        if(busy){notify("任务执行中, 请等待完成后再新建会话",true);return}
        let r;try{r=await post("/api/session",{action:"new",sid:"",value:""})}catch(err){r={ok:false,error:String(err&&err.message||err)}}
        notify(r.msg||r.error||"已新建会话",!(r&&r.ok));
        if(r&&r.ok){onSessionChanged("new");setSessVer(v=>v+1)}
      }else notify("用法: /session new",true);
      return}
    if(head==="/tools"){setShowToolMenu(true);return}
    if(head==="/mode"){
      if(["checklist","auto","chat"].includes(arg))changeMode(arg);
      else notify("用法: /mode checklist|auto|chat",true);
      return}
    if(head==="/thinking"){
      if(["on","off"].includes(arg))cmd("thinking",arg);
      else notify("用法: /thinking on|off",true);
      return}
    if(head==="/checkpoint"){
      const sub=rest[0]||"";
      if(sub==="create")cmd("checkpoint_create",rest.slice(1).join(" "));
      else if(sub==="switch"&&rest[1])rollbackSnapshot(rest[1]);
      else notify("用法: /checkpoint create [备注] | /checkpoint switch <ID>",true);
      return}
    if(head==="/checkpoints"){
      const cps=(state&&state.checkpoints||[]);
      pushItem({kind:"sys",text:cps.length?("⛃ 项目快照(近"+cps.length+"个):\n"+cps.slice().reverse().map(c=>"  ["+c.id+"] "+(c.note||"")+" · "+(c.created||"")+" · "+(c.files||0)+"个文件").join("\n")):"（暂无快照, 用 /checkpoint create 创建）"});
      return}
    if(head==="/skills"){setShowSkills(true);return}
    if(head==="/env"){setShowEnv(true);return}
    if(head==="/files"){setShowFiles(true);return}
    if(head==="/workspace"){setShowWorkspace(true);return}
    if(head==="/mcp"){setShowMcp(true);return}
    if(head==="/settings"){setShowEnv(true);return}
    notify("未知命令: "+head+"（输入 / 查看全部命令）",true);
  }

  /* 人机协同实时共驾 —— 任务执行中发送协同指令, 智能体下一轮即时吸收 */
  async function steer(){
    const t=prompt.trim();
    if(!t)return;
    setPrompt("");
    let r;
    try{ r=await post("/api/steer",{text:t}); }
    catch(err){ r={ok:false,error:"网络异常: "+((err&&err.message)||err)}; }
    if(!r||!r.ok){setPrompt(t);notify((r&&r.error)||"协同指令发送失败",true)}
  }

  async function submit(){
    let p=prompt.trim();
    if(busy){steer();return}
    if(!p&&!fileRefs.length) return;
    /* 斜杠命令拦截 —— 仅单行且命令头在白名单才执行(避免误伤以/开头的路径类任务) */
    if(p.startsWith("/")&&!p.includes("\n")&&!fileRefs.length&&!attachments.length
       &&SLASH_HEADS.has(p.split(/\s+/)[0].toLowerCase())){runSlash(p);return}
    if(fileRefs.length)   // 文件管理导入的文件 —— 绝对路径注入(智能体可直接 read_file 绝对路径)
      p+="\n\n[用户导入的文件(绝对路径, 可直接 read_file)]\n"+fileRefs.map(f=>`- ${f.abs_path} (${fmtSize(f.size)})`).join("\n");
    if(attachments.length)   // 附件路径注入任务描述, 智能体可直接 read_file
      p+="\n\n[用户上传的附件(工作区相对路径)]\n"+attachments.map(a=>`- ${a.path} (${fmtSize(a.size)})`).join("\n");
    /* 先备份再清空 —— 提交失败时恢复输入, 避免用户内容丢失 */
    const bak={prompt,attachments:attachments.slice(),fileRefs:fileRefs.slice()};
    setPrompt("");setAttachments([]);setFileRefs([]);
    let r;
    try{ r=await post("/api/task",{prompt:p,policy:buildPolicy()}); }
    catch(err){ r={ok:false,error:"网络异常: "+((err&&err.message)||err)}; }
    if(!r||!r.ok){
      setPrompt(bak.prompt);setAttachments(bak.attachments);setFileRefs(bak.fileRefs);
      pushItem({kind:"error",text:"任务提交失败: "+((r&&r.error)||"未知错误")+"（输入内容已恢复, 请检查服务后重试）"});
    }
  }

  /* cmd() 补齐网络异常捕获 —— 失败以 error 样式醒目提示, 成功仍走 sys */
  async function cmd(c,a){
    let r;
    try{ r=await post("/api/command",{cmd:c,arg:a||""}); }
    catch(err){ r={ok:false,error:"网络异常: "+((err&&err.message)||err)}; }
    if(!r||r.ok===false) pushItem({kind:"error",text:"命令「"+c+"」执行失败: "+((r&&(r.error||r.msg))||"未知错误")});
    else pushItem({kind:"sys",text:r.msg||"命令已执行"});
    refresh();
  }
  /* 快照ID点击回滚 —— 交付物卡片/右侧面板的快照ID可直接点击回滚到该版本 */
  const rollbackSnapshot=useCallback(sid=>{
    if(!sid)return;
    if(busy){notify("任务执行中, 禁止回滚",true);return}
    if(confirm("回滚到快照 "+sid+" ？\n工作区文件将恢复到该时刻(回滚前会自动备份当前状态)")){
      notify(" 正在回滚到 "+sid+" …");cmd("checkpoint_rollback",sid);
    }},[busy]);
  /* 交付物快照状态机 —— 点击后进入 pending(按钮变创建中), 后端经
     artifact_snapshot 事件回推快照ID, 按钮消失并原位显示快照ID; 失败则恢复按钮 */
  const snapshotArtifact=useCallback(async a=>{
    if(busy){notify("任务执行中, 请等待完成后再创建快照",true);return}
    if(!a||!a.id){notify("该交付物缺少标识, 无法绑定快照",true);return}
    const note=("交付物快照: "+(a.title||"成果交付")).slice(0,80);
    setSnapMap(m=>({...m,[a.id]:"pending"}));
    let r;
    try{ r=await post("/api/command",{cmd:"checkpoint_create",arg:note,art_id:a.id}); }
    catch(err){ r={ok:false,error:String((err&&err.message)||err)}; }
    if(!r||r.ok===false){
      setSnapMap(m=>{const n={...m};delete n[a.id];return n});
      pushItem({kind:"error",text:"快照创建失败: "+((r&&r.error)||"未知错误")});
    }else pushItem({kind:"sys",text:r.msg||" 快照创建中…"});
    refresh();
  },[busy]);
  /* v4.0.0: 模式联动工具预设 —— 对话模式默认仅勾选常用工具(执行bash/检索网络/阅读网页/向用户提问), 切换其它模式恢复全选 */
  const CHAT_DEFAULT_TOOLS=["bash","web_search","web_fetch","ask_user_question"];
  function changeMode(m){
    cmd("mode",m);
    const n={};(state&&state.tools||[]).forEach(t=>n[t.name]=(m==="chat")?CHAT_DEFAULT_TOOLS.includes(t.name):true);
    setToolSelPersist(n);
    pushItem({kind:"sys",text:(m==="chat")?"💬 对话模式: 已默认仅勾选 执行Shell命令/全网搜索/网页阅读/向用户提问 4个常用工具(可在下方\u300c工具\u300d面板调整)":" 已恢复全部工具勾选"});
  }
  async function stopTask(){const r=await post("/api/stop",{});if(!r.ok)notify(r.error||"终止失败",true);}
  const notify=useCallback((text,isErr)=>pushItem({kind:isErr?"error":"sys",text:text||""}),[]);

  /* 会话切换/新建后 —— 清空时间线; 切换时回放目标会话历史;
     右侧栏(成果物/清单/成本)同步清空后由 refresh 拉取当前会话数据;
     新建会话时重置工具选择为全选(清除持久化记录) */
  const onSessionChanged=useCallback(async action=>{
    itemsRef.current=[];setItems([]);setTodos(null);setPreview(null);
    setArtifacts([]);setCost(null);setChain([]);
    /* 数据溯源联动 —— 切换即先清空, 目标会话有信源则由 sources 事件/refresh 重建 */
    setState(s=>s?{...s,sources:[]}:s);setSrcExpand(false);
    if(action==="new"){
      try{localStorage.removeItem(TOOLSEL_KEY)}catch(_){}
      const n={};(state&&state.tools||[]).forEach(t=>n[t.name]=true);setToolSel(n);
    }
    if(action==="switch"){
      try{
        const h=await api("/api/history");
        const restored=[];
        for(const m of (h.items||[])){
          if(m.kind==="user")restored.push({kind:"user",text:m.text});
          else if(m.kind==="steer")restored.push({kind:"steer",text:m.text,acked:true});
          else if(m.kind==="reasoning")restored.push({kind:"reasoning",text:m.text,closed:true}); /* 历史回放恢复思考内容 */
          else if(m.kind==="assistant")restored.push({kind:"assistant",text:m.text,closed:true});
          else if(m.kind==="tool")restored.push({kind:"tool",
            start:{tool:m.tool,title:m.title,brief:m.brief,dt:m.dt},
            end:{result:m.result,dt:m.dt,title:m.title}});
        }
        if(restored.length)restored.push({kind:"sys",text:"—— 以上为该会话的历史执行记录 ——"});
        itemsRef.current=restored;setItems(restored);
      }catch(_){}
    }
    refresh();
  },[refresh]);

  /* 附件上传: 读取为 base64 -> POST /api/upload -> 记录工作区相对路径 */
  async function onPickFiles(ev){
    const files=Array.from(ev.target.files||[]);
    ev.target.value="";
    if(!files.length) return;
    setUploading(true);
    for(const f of files){
      if(f.size>20*1024*1024){notify(`「${f.name}」超过 20MB 上限`,true);continue}
      try{
        const b64=await new Promise((res,rej)=>{const r=new FileReader();
          r.onload=()=>res(String(r.result).split(",",2)[1]||"");r.onerror=rej;r.readAsDataURL(f)});
        const r=await post("/api/upload",{name:f.name,data:b64});
        if(r.ok)setAttachments(a=>[...a,r]);
        else notify(`「${f.name}」上传失败: ${r.error}`,true);
      }catch(_){notify(`「${f.name}」读取失败`,true)}
    }
    setUploading(false);
  }

  return html`<div class="h-screen flex flex-col" onClick=${()=>showToolMenu&&setShowToolMenu(false)}>
    <!-- 顶栏 -->
    <header class="flex items-center gap-3 px-3 sm:px-5 py-3 border-b border-gray-800 bg-[#0d1320] overflow-x-auto whitespace-nowrap [&>*]:shrink-0" style=${{WebkitOverflowScrolling:"touch"}}>
      <div class="text-lg font-black tracking-wide"><span class="text-cyan-400">Haisnap</span><span class="text-gray-200">Code</span>
        <span class="text-[10px] text-gray-500 ml-1">网页版 v${state?state.version:"…"}</span></div>
      <div class="text-xs text-gray-500">主模型 <span class="text-gray-300">${state?state.model:"qwen3.7-max"}</span></div>
      <div class="text-xs text-gray-500">视觉模型 <span class="text-violet-400">${state?state.vision_model||"qwen3.7-plus":""}</span></div>
      <div class="text-xs text-gray-500 truncate max-w-xs hidden md:block">📁 ${state?state.workdir:""}</div>
      ${state&&state.reflexion&&state.reflexion.times>0?html`<span class="text-[10px] text-fuchsia-500">♻${state.reflexion.times}</span>`:""}
      ${domain&&html`<span class="text-[10px] px-1.5 py-0.5 rounded-full border border-fuchsia-500/40 text-fuchsia-400 shrink-0" title=${"垂直领域异构执行引擎 · "+(domain.strategy_brief||"")}>/ ${domain.name} /</span>`}
      <div class="ml-auto flex items-center gap-2">

    <div class="flex flex-1 overflow-hidden">
      <!-- 左侧: 会话 + 工具策略 -->

        <${SessionPanel} busy=${busy} notify=${notify} onSessionChanged=${onSessionChanged} ver=${sessVer}/>
      </aside>
      <!-- v8.5 移动端: 会话抽屉(lg 以下可用) -->
      ${mobilePanel==="sess"&&html`<div class="fixed inset-0 z-40 lg:hidden">
        <div class="absolute inset-0 bg-black/60" onClick=${()=>setMobilePanel(null)}></div>
        <div class="absolute left-0 top-0 bottom-0 w-72 max-w-[85vw] bg-[#0d1320] border-r border-gray-800 p-3 overflow-y-auto shadow-2xl">
          <div class="flex items-center mb-2"><span class="text-xs font-bold text-gray-400">💬 会话</span>
            <button onClick=${()=>setMobilePanel(null)} class="ml-auto px-2.5 py-1 rounded-lg border border-gray-700 text-gray-400 text-xs">✕ 关闭</button></div>
          <${SessionPanel} busy=${busy} notify=${notify} onSessionChanged=${sid=>{onSessionChanged(sid);setMobilePanel(null)}} ver=${sessVer}/>
        </div>
      </div>`}

      <!-- 中间: 时间线 -->
      <main class="flex-1 flex flex-col overflow-hidden">
        <div class="flex-1 overflow-y-auto px-3 sm:px-5 py-4">

            <div class="text-5xl mb-4">✦</div>
            <div class="text-lg text-gray-400 font-bold">omni-agent 网页版驾驶舱</div>
            <div class="text-sm mt-2">思考推流 · 工具时间线 · Swarm树状执行 · 远程审批 · 技能勾选启用 · 成果物预览下载</div>
             </div>`}
          ${items.map((it,i)=>{
            if(it.kind==="user") return html`<div key=${i} class="msg-row flex justify-end my-3 items-center gap-1.5"><${CopyTag} text=${it.text}/><div class="max-w-2xl bg-cyan-800/40 border border-cyan-700/50 rounded-2xl rounded-br-sm px-4 py-2 text-sm" style=${{whiteSpace:"pre-wrap",wordBreak:"break-word"}}>${it.text}</div></div>`;
            if(it.kind==="policy") return html`<div key=${i} class="text-[11px] text-fuchsia-400 my-1">⛨ 工具策略: ${it.text}</div>`;
            if(it.kind==="steer") return html`<div key=${i} class="msg-row flex justify-end my-2"><div class="max-w-2xl bg-amber-800/30 border border-amber-600/50 rounded-2xl rounded-br-sm px-4 py-2 text-sm">
              <div class="text-[10px] mb-0.5 ${it.acked?"text-emerald-400":"text-amber-500"}">${it.acked?"洞穿指令已生效":" 洞穿指令排队中…"}</div>
              ${it.text}</div></div>`;
            if(it.kind==="reasoning") return html`<details key=${i} class="my-1 text-xs text-gray-500"><summary class="cursor-pointer">✻ 思考过程 (${it.text.length} 字)</summary><pre class="mt-1 bg-black/20 rounded p-2 max-h-40 overflow-auto">${it.text}</pre></details>`;
            if(it.kind==="assistant") return html`<div key=${i} class="my-2 max-w-3xl"><${Markdown} text=${it.text}/></div>`;
            if(it.kind==="tool") return html`<${ToolCard} key=${i} start=${it.start} end=${it.end}/>`;
            if(it.kind==="swarm") return html`<${SwarmCard} key=${i} it=${it}/>`;
            if(it.kind==="approval") return html`<${ApprovalCard} key=${i} e=${it.e}/>`;
            if(it.kind==="question") return html`<${QuestionCard} key=${i} e=${it.e}/>`;
            if(it.kind==="artifacts") return html`<${ArtifactCard} key=${i} e=${it.e} onPreview=${previewFile} onSnapshot=${snapshotArtifact} onRollback=${rollbackSnapshot} onChanges=${loadChanges} snap=${snapMap[it.e&&it.e.id]||""}/>`;
            if(it.kind==="notice") return html`<div key=${i} class="card p-3 my-2 text-sm text-violet-300">📢 ${(it.e.questions||[]).map(q=>q.question).join(" / ")}</div>`;
            if(it.kind==="done") return html`<div key=${i} class="my-2 text-xs text-emerald-400 flex items-center gap-2">✓ 任务完成${it.time&&html`<span class="text-gray-500 font-normal">🕒 ${it.time}</span>`}</div>`;
            if(it.kind==="next_actions") return html`<div key=${i} class="my-2">
              <div class="text-[11px] text-gray-500 mb-1.5">⚡ 下一步建议</div>
              <div class="flex flex-wrap gap-1.5">
                ${(it.actions||[]).map((a,j)=>html`<button key=${j} disabled=${busy}
                  onClick=${()=>{if(busy){notify("当前有任务执行中, 请稍后",true);return}
                    /* 不再本地 pushItem 用户消息 —— 后端 task_start 事件会统一
                       推送用户气泡, 修复点击建议后同一条消息出现两次、刷新后变一条 */
                    post("/api/task",{prompt:a,policy:buildPolicy()}).then(r=>{
                      if(!r||!r.ok)pushItem({kind:"error",text:"任务提交失败: "+((r&&r.error)||"未知错误")});
                    }).catch(err=>pushItem({kind:"error",text:"网络异常: "+((err&&err.message)||err)}));}}
                  class=${"px-3 py-1.5 rounded-full border border-cyan-700/60 text-cyan-300 text-xs hover:bg-cyan-900/40 hover:border-cyan-500 transition-colors"+(busy?" opacity-40 cursor-not-allowed":"")}>${a}</button>`)}
              </div>
            </div>`;
            if(it.kind==="maxturns") return html`<div key=${i} class="card p-3 my-2 border-yellow-500/70 text-xs text-yellow-600">
              <div class="font-bold flex items-center gap-2"> 已达单任务最大轮次，任务未完成已暂停${it.time&&html`<span class="text-gray-500 font-normal ml-auto">🕒 ${it.time}</span>`}</div>
              <div class="mt-1 text-gray-500">${it.text}</div>
              <div class="mt-1 text-[10px] text-gray-400">提示: 发送「继续」可让智能体接着执行剩余步骤。</div></div>`;
            if(it.kind==="error") return html`<div key=${i} class="my-2 text-xs text-rose-400">
              <div> ${it.text}</div>
              ${it.resumable&&html`<div class="mt-1 text-[10px] text-amber-500"> 任务在执行中异常中断, 发送「继续」可在断点处续跑未完成的步骤</div>`}
            </div>`;
            if(it.kind==="reflexion") return html`<div key=${i} class="card p-3 my-2 border-fuchsia-500/60 text-xs">
              <div class="font-bold text-fuchsia-500 flex items-center gap-2">♻ Reflexion 自愈反思 <span class="text-[10px] text-gray-500 font-normal">连续 ${it.e.count} 次失败 · ${it.e.ts||""}</span></div>
              ${(it.e.errors||[]).map((er,j)=>html`<div key=${j} class="mt-1 text-[10px] text-rose-400 truncate"> ${er}</div>`)}
              <div class="mt-2 text-gray-600 whitespace-pre-wrap">${it.e.strategy||""}</div>
              <div class="mt-1 text-[10px] text-gray-400">纠偏策略已注入上下文，同类错误已写入跨会话经验库</div></div>`;
            if(it.kind==="sys") return html`<div key=${i} class="my-1 text-[11px] text-gray-500 ${String(it.text||"").includes("\n")?"whitespace-pre-wrap font-mono bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 max-w-3xl":""}">${String(it.text||"").includes("\n")?it.text:html`· ${it.text}`}</div>`;
            return null;})}
          ${busy&&(()=>{const last=items[items.length-1];
            if(!last)return true;
            /* loading 标识贯穿整个任务(含思考结束后→执行方法前的间隙):
               仅当末尾条目自身已呈现活动态才隐藏 ——
               ①未完结的回答流(assistant未closed) ②执行中的工具(自带计时loading)
               ③等待交互的审批/提问卡片。reasoning 结束后不再隐藏(修复思考完成到
               首个工具启动间的无指示空窗); 任务结束/异常退出时 busy=false 自动消失 */
            if(last.kind==="assistant"&&!last.closed)return false;
            if(last.kind==="tool"&&!last.end)return false;
            if(last.kind==="approval"||last.kind==="question")return false;
            if(last.kind==="swarm"&&!last.done)return false;
            return true;})()
            &&html`<${LoadingDots}/>`}
          <div ref=${bottomRef}></div>
        </div>
        <!-- 输入区(Manus/Kimi 风格一体化 composer) -->
        <div class="px-4 pb-4 pt-2">
          <div class="max-w-3xl mx-auto">
            <div class="relative">
            ${slashMatches.length>0&&html`<div class="absolute bottom-full mb-2 left-0 right-0 max-h-72 overflow-y-auto rounded-2xl bg-white border border-gray-200 shadow-[0_8px_32px_rgba(15,23,42,.16)] py-1.5 z-40">
              <div class="px-4 py-1 text-[10px] text-gray-400 flex items-center">⌨ 快捷命令<span class="ml-auto">↑↓ 选择 · Tab 补全 · Enter 执行 · Esc 关闭</span></div>
              ${slashMatches.map((m,i)=>html`<div key=${m.c}
                onMouseEnter=${()=>setSlashIdx(i)}
                onMouseDown=${e=>{e.preventDefault();runSlash(m.c)}}
                class="px-4 py-2 flex items-baseline gap-3 cursor-pointer ${i===sIdx?"bg-cyan-50":""}">
                <span class="font-mono text-[13px] ${i===sIdx?"text-cyan-700 font-bold":"text-gray-700"}">${m.c}</span>
                <span class="text-[11px] text-gray-400 truncate">${m.d}</span>
              </div>`)}
            </div>`}
            <div class="composer rounded-3xl bg-white border border-gray-200 shadow-[0_4px_24px_rgba(15,23,42,.08)] focus-within:border-cyan-400 focus-within:shadow-[0_4px_28px_rgba(8,145,178,.15)] transition-all">
              ${(fileRefs.length>0||attachments.length>0)&&html`<div class="px-4 pt-3 flex flex-wrap gap-1.5">
                ${fileRefs.map((f,i)=>html`<span key=${"r"+i} title=${f.abs_path}
                  class="flex items-center gap-1.5 text-[11px] bg-emerald-50 border border-emerald-200 rounded-xl px-2.5 py-1.5 max-w-xs">
                  <span>${fileIcon(f.ext)}</span>
                  <span class="flex flex-col min-w-0">
                    <span class="text-gray-700 truncate">${f.name}</span>
                    <span class="text-[9px] text-gray-400 truncate">${f.abs_path}</span>
                  </span>
                  <span class="text-gray-400 shrink-0">${fmtSize(f.size)}</span>
                  <button onClick=${()=>setFileRefs(x=>x.filter((_,j)=>j!==i))} class="text-gray-400 hover:text-rose-500 shrink-0">✕</button></span>`)}
                ${attachments.map((a,i)=>html`<span key=${"a"+i} class="flex items-center gap-1 text-[11px] bg-gray-100 border border-gray-200 rounded-full px-2.5 py-1">
                  📎 ${a.name} <span class="text-gray-400">${fmtSize(a.size)}</span>
                  <button onClick=${()=>setAttachments(x=>x.filter((_,j)=>j!==i))} class="text-gray-400 hover:text-rose-500 ml-1">✕</button></span>`)}
              </div>`}
              <textarea rows="1" value=${prompt}
                placeholder=${busy?"协同透传: 输入指令，可实时干预智能体编排...":"给 omni-agent 一个任务，例如：写一个 Mac 风格科学计算器并部署"}
                onInput=${e=>{setPrompt(e.target.value);setSlashIdx(0);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,200)+"px"}}
                onKeyDown=${e=>{
                  if(slashMatches.length&&!e.nativeEvent.isComposing){
                    if(e.key==="ArrowDown"){e.preventDefault();setSlashIdx(i=>(i+1)%slashMatches.length);return}
                    if(e.key==="ArrowUp"){e.preventDefault();setSlashIdx(i=>(i-1+slashMatches.length)%slashMatches.length);return}
                    if(e.key==="Tab"){e.preventDefault();const m=slashMatches[sIdx];if(m){setPrompt(m.c+" ");setSlashIdx(0)}return}
                    if(e.key==="Escape"){e.preventDefault();setPrompt("");setSlashIdx(0);return}
                    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const m=slashMatches[sIdx];
                      const typed=prompt.trim();
                      /* 若已完整输入命令(含参数)则直接执行; 否则执行选中项 */
                      if(m&&typed.split(/\s+/).length===1&&typed!==m.c.split(" ")[0]){runSlash(m.c)}
                      else if(m&&typed===m.c.split(" ")[0]&&m.c.includes(" ")){setPrompt(m.c.split(" ")[0]+" ")}
                      else runSlash(typed);
                      return}
                  }
                  if(e.key==="Enter"&&!e.shiftKey&&!e.nativeEvent.isComposing){e.preventDefault();submit()}}}
                style=${{minHeight:"52px",maxHeight:"200px"}}
                class="w-full bg-transparent px-5 pt-4 pb-1 text-[15px] text-gray-800 placeholder-gray-400 outline-none resize-none"></textarea>
              <div class="flex items-center gap-1 px-3 pb-2.5">
                <input ref=${fileRef} type="file" multiple class="hidden" onChange=${onPickFiles}/>
                <button onClick=${()=>fileRef.current&&fileRef.current.click()} disabled=${uploading} title="上传附件(≤20MB)"
                  class="w-9 h-9 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-cyan-600 transition-colors ${uploading?"opacity-50":""}">${uploading?"":html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>`}</button>
                <button onClick=${()=>setShowFiles(true)} title="从本地文件管理导入"
                  class="w-9 h-9 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-yellow-600 transition-colors">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></button>
                <button onClick=${()=>setShowWorkspace(true)} title="工作空间(任务工作目录文件管理)"
                  class="h-8 px-3 flex items-center gap-1 rounded-full text-[11px] text-gray-500 hover:bg-gray-100 hover:text-cyan-600 transition-colors">
                   工作空间</button>
                <button onClick=${()=>setShowSkills(true)} title="技能管理(勾选启用/安装/卸载)"
                  class="h-8 px-3 flex items-center gap-1 rounded-full text-[11px] text-gray-500 hover:bg-gray-100 hover:text-emerald-600 transition-colors">
                   技能</button>
                <span class="relative">
                  ${(()=>{const names=(state&&state.tools||[]).map(t=>t.name);
                    const off=names.filter(n=>toolSel[n]===false).length;
                    return html`<button onClick=${()=>setShowToolMenu(v=>!v)} title="工具多选(默认全部勾选; 取消勾选的工具本次任务禁用)"
                      class="h-8 px-3 flex items-center gap-1 rounded-full text-[11px] transition-colors ${off>0?"bg-amber-50 text-amber-700 border border-amber-200":"text-gray-500 hover:bg-gray-100 hover:text-cyan-600"}">
                       工具${off>0?` (禁用${off})`:""}</button>`})()}
                  ${showToolMenu&&html`<div class="absolute bottom-11 left-0 w-72 max-h-80 overflow-auto rounded-2xl bg-white border border-gray-200 shadow-xl p-3 z-40"
                    onClick=${e=>e.stopPropagation()}>
                    <div class="flex items-center mb-2">
                      <span class="text-xs font-bold text-gray-600"> 可用工具（默认全选）</span>
                      <button onClick=${()=>{const n={};(state&&state.tools||[]).forEach(t=>n[t.name]=true);setToolSelPersist(n)}}
                        class="ml-auto text-[10px] px-2 py-0.5 rounded border border-gray-300 text-gray-500 hover:border-emerald-400 hover:text-emerald-600">全选</button>
                      <button onClick=${()=>{const n={};(state&&state.tools||[]).forEach(t=>n[t.name]=false);setToolSelPersist(n)}}
                        class="ml-1 text-[10px] px-2 py-0.5 rounded border border-gray-300 text-gray-500 hover:border-amber-400 hover:text-amber-600">全不选</button>
                      <button onClick=${()=>setShowToolMenu(false)}
                        class="ml-1 text-[10px] px-2 py-0.5 rounded border border-gray-300 text-gray-500 hover:border-rose-400 hover:text-rose-500">✕</button>
                    </div>
                    <div class="space-y-0.5">
                      ${(state&&state.tools||[]).map(t=>html`<label key=${t.name} title=${t.name+" · "+(t.description||"")}
                        class="flex items-center gap-2 text-[11px] px-1.5 py-1 rounded-lg hover:bg-gray-50 cursor-pointer select-none">
                        <input type="checkbox" checked=${toolSel[t.name]!==false}
                          onChange=${ev=>setToolSelPersist(s=>({...s,[t.name]:ev.target.checked}))} class="accent-cyan-600"/>
                        <span class="${toolSel[t.name]===false?"line-through text-gray-400":"text-gray-700"}">${t.title||t.name}</span>
                        <span class="text-[9px] text-gray-400 font-mono ml-auto truncate max-w-[90px]">${t.name}</span>
                      </label>`)}
                    </div>
                    <div class="text-[9px] text-gray-400 mt-2 leading-relaxed">取消勾选的工具将在本次任务中禁用（任务级黑名单）；全部勾选＝不限制。</div>
                  </div>`}
                </span>
                <span class="flex-1"></span>
                <span class="text-[10px] text-gray-300 hidden sm:block mr-2">Enter 发送 · Shift+Enter 换行</span>
                ${busy?html`<span class="flex items-center gap-1.5">

                    class="h-10 px-4 flex items-center gap-1.5 rounded-full bg-gradient-to-br from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white text-xs font-bold transition-all shadow-md">↑ 透传</button>`}
                  <button onClick=${stopTask} title="终止当前任务"
                  class="w-10 h-10 flex items-center justify-center rounded-full bg-rose-500 hover:bg-rose-600 text-white transition-colors shadow-md">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button></span>`
                :html`<button onClick=${submit} disabled=${!prompt.trim()&&!fileRefs.length} title="发送(Enter)"
                  class="w-10 h-10 flex items-center justify-center rounded-full transition-all shadow-md ${(prompt.trim()||fileRefs.length)?"bg-gradient-to-br from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white scale-100":"bg-gray-200 text-gray-400 cursor-not-allowed scale-95"}">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>`}
              </div>
            </div>
            </div>
            <div class="mt-1.5 text-center text-[10px] text-gray-400">
              输入 / 唤起快捷命令 · 敏感命令将推送到本页审批 · Haisnap AI</div>
          </div>
        </div>
      </main>

      <!-- 右侧: 状态面板(xl+ 常驻; 以下由移动端抽屉承载, 复用同一份内容) -->
      <aside class=${(mobilePanel==="status"
          ?"fixed right-0 top-0 bottom-0 w-80 max-w-[88vw] z-40 bg-[#0d1320] border-l border-gray-800 p-3 overflow-y-auto shadow-2xl space-y-4 block xl:relative xl:w-72 xl:z-auto xl:shadow-none"
          :"w-72 border-l border-gray-800 p-3 overflow-y-auto hidden xl:block space-y-4")}>
        ${mobilePanel==="status"&&html`<div class="flex items-center xl:hidden"><span class="text-xs font-bold text-gray-400"> 状态面板</span>
          <button onClick=${()=>setMobilePanel(null)} class="ml-auto px-2.5 py-1 rounded-lg border border-gray-700 text-gray-400 text-xs">✕ 关闭</button></div>`}
        <div>
          <div class="text-xs font-bold text-gray-400 mb-1"> 任务身份</div>
          <div class="card p-2 text-[11px] text-gray-300">${state?state.brief:"…"}</div>
        </div>
        <div>
          <div class="text-xs font-bold text-gray-400 mb-1"> 成果物 ${artifacts.length?`(${artifacts.length})`:""}</div>
          ${artifacts.length?html`<div class="space-y-1.5">${artifacts.slice(-6).reverse().map((a,i)=>html`
            <div key=${i} class="card p-2">
              <div class="flex items-center gap-1">
                <div class="text-[11px] text-gray-300 truncate flex-1">${a.title||"(未命名交付)"}</div>
                ${(a.snapshot_id||(snapMap[a.id]&&snapMap[a.id]!=="pending"))
                  ?html`<button onClick=${()=>rollbackSnapshot(a.snapshot_id||snapMap[a.id])}
                    title="已固化快照, 点击回滚到该版本"
                    class="text-[9px] px-1.5 py-0.5 rounded bg-cyan-900/50 border border-cyan-600 text-cyan-300 shrink-0 hover:bg-cyan-800/60 hover:border-cyan-400 cursor-pointer">✓ ${a.snapshot_id||snapMap[a.id]} ↩</button>`
                  :snapMap[a.id]==="pending"
                  ?html`<span class="text-[9px] px-1.5 py-0.5 rounded border border-cyan-800 text-cyan-500 shrink-0 blink"> 创建中</span>`
                  :html`<button onClick=${()=>snapshotArtifact(a)} title="以当前工作区状态创建快照"
                    class="text-[9px] px-2 py-0.5 rounded border border-cyan-800 text-cyan-500 hover:bg-cyan-900/40 shrink-0"> 快照</button>`}
                  <button onClick=${()=>loadChanges(a.id)} title="查看该交付物完成时间至上一个交付物时间段内的变更文件"
                class="text-[9px] px-2 py-0.5 rounded border border-amber-800 text-amber-500 hover:bg-amber-900/40 hover:border-amber-400 "> 变更</button>
              </div>
              ${a.ts_str&&html`<div class="text-[9px] text-gray-500 mt-0.5">🕒 更新于 ${a.ts_str}</div>`}
              
              ${a.preview_url&&html`<a href=${/^https?:/i.test(a.preview_url)?a.preview_url:new URL(a.preview_url,location.href).href}
                target="_blank" rel="noreferrer" title="直达交付物(完整访问路径)"
                class="text-[10px] text-cyan-500 hover:underline truncate block">🔗 ${/^https?:/i.test(a.preview_url)?a.preview_url:new URL(a.preview_url,location.href).href}</a>`}
              ${(a.files||[]).map((f,fi)=>html`<div key=${fi} class="flex items-center gap-1 text-[10px] text-gray-400 mt-0.5">
                <span class="truncate flex-1">${fileIcon(f.ext)} ${f.name}</span>
                ${f.previewable&&html`<button onClick=${()=>previewFile(f)} class="text-emerald-500 hover:text-emerald-300">预览</button>`}
                <a href=${fileUrl("download",f)} download=${f.name} class="text-cyan-500 hover:text-cyan-300">下载</a>
              </div>`)}
            </div>`)}
          </div>`:html`<div class="text-[11px] text-gray-600">（任务交付成功后自动出现）</div>`}
        </div>
        <div>
          <div class="text-xs font-bold text-gray-400 mb-1">📋 任务清单 ${todos&&todos.total?`${todos.completed}/${todos.total}`:""}</div>
          ${todos&&todos.total?html`<div class="space-y-1">${todos.items.map((t,i)=>html`<div key=${i} class="text-[11px] flex gap-1.5">
            <span>${t.status==="completed"?"":t.status==="in_progress"?"🔄":"⚪"}</span>
            <span class=${t.status==="completed"?"text-gray-500 line-through":"text-gray-300"}>${t.content}</span></div>`)}
            <div class="h-1.5 bg-gray-800 rounded-full mt-1"><div class="h-1.5 bg-cyan-500 rounded-full" style=${{width:(todos.completed/todos.total*100)+"%"}}></div></div>
          </div>`:html`<div class="text-[11px] text-gray-600">（暂无清单）</div>`}
        </div>
        <div>
          <div class="text-xs font-bold text-gray-400 mb-1">💰 Token 成本</div>
          <div class="card p-2 text-[11px] text-gray-300">
            调用 ${cost?cost.calls:0} 次 · prompt ${cost?cost.prompt_tokens:0} · completion ${cost?cost.completion_tokens:0} · 缓存命中 ${cost&&cost.cached_tokens?cost.cached_tokens:0}</div>
        </div>
        <div>
          <div class="flex items-center text-xs font-bold text-gray-400 mb-1">⛃ 快照
            <button onClick=${()=>cmd("checkpoint_create","网页手动快照")} class="ml-auto text-[10px] px-1.5 py-0.5 rounded border border-gray-700 hover:border-cyan-500">+新建</button></div>
          <div class="space-y-1">${(state&&state.checkpoints||[]).slice().reverse().map((c,i)=>html`
            <div key=${i} class="text-[10px] text-gray-400 flex items-center gap-1">
              <span class="font-mono text-gray-500">${c.id}</span><span class="truncate flex-1">${c.note}</span>
              <button onClick=${()=>{if(busy){notify("任务执行中, 禁止回滚",true);return}
                if(confirm("回滚到快照 "+c.id+" ？\n工作区文件将恢复到该时刻(回滚前会自动备份当前状态)"))
                  {notify(" 正在回滚到 "+c.id+" …");cmd("checkpoint_rollback",c.id)}}}
                class="text-cyan-500 hover:text-cyan-300">回滚</button></div>`)}
          </div>
        </div>
        <div>
          <div class="flex items-center text-xs font-bold text-gray-400 mb-1">🔗 数据溯源
            ${state&&(state.sources||[]).length>0&&html`<span class="ml-1 text-[10px] text-gray-500">(${state.sources.length})</span>`}
            ${state&&(state.sources||[]).length>5&&html`<button onClick=${()=>setSrcExpand(x=>!x)}
              class="ml-auto text-[10px] px-1.5 py-0.5 rounded border border-gray-700 hover:border-cyan-500">${srcExpand?"收起 ▲":"展开全部 ▼"}</button>`}
          </div>
          <div class="space-y-1 ${srcExpand?"max-h-96 overflow-y-auto pr-1":""}">
            ${(state&&state.sources||[]).slice(srcExpand?0:-5).map((s,i)=>html`
            <div key=${i} class="text-[10px] text-gray-500">
              <div class=${srcExpand?"":"truncate"}>[${s.id}] <a href=${s.url} target="_blank" title=${s.url} class="text-cyan-600 hover:underline">${s.title}</a></div>
              ${srcExpand&&html`<div class="text-[9px] text-gray-600 pl-4 truncate">${s.org||""}${s.date?" · "+s.date:""} · ${s.url}</div>`}
            </div>`)}
            ${(!state||!(state.sources||[]).length)&&html`<div class="text-[11px] text-gray-600">（暂无信源登记）</div>`}
          </div>
        </div>
        <div>
          <div class="text-xs font-bold text-gray-400 mb-1"> 快速追加项目记忆</div>
          <input placeholder="输入备注后回车写入 HAISNAP.md"
            onKeyDown=${e=>{if(e.key==="Enter"&&e.target.value.trim()){cmd("memory_add",e.target.value.trim());e.target.value=""}}}
            class="w-full bg-black/30 border border-gray-700 rounded-lg px-2 py-1.5 text-[11px] outline-none focus:border-cyan-500"/>
        </div>
        <div>
          <div class="text-xs font-bold text-gray-400 mb-1"> 执行时间轴 ${chain.filter(n=>n.kind==="node").length?html`<span class="text-cyan-400">${chain.filter(n=>n.kind==="node").length} 步 · 共 ${chain.reduce((s,n)=>s+(n.dt||0),0).toFixed(1)}s</span>`:""}</div>
          ${chain.length?html`<div class="card p-2.5"><div class="hs-tl">
            ${chain.map((n,i)=>n.kind==="turn"
              ?html`<div key=${i} class="hs-tl-turn">第 ${n.n} 轮</div>`
              :html`<div key=${i} class="hs-tl-item">
                <span class=${"hs-tl-dot "+(n.status==="running"?"running":n.status==="error"?"error":"ok")}></span>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 text-[11px]">
                    <span class=${"font-semibold "+(n.status==="running"?"text-cyan-500":n.status==="error"?"text-rose-400":"text-gray-300")}>${n.title}</span>
                    ${n.status==="running"&&html`<span class="text-cyan-500 blink text-[9px]">执行中</span>`}
                    <span class="ml-auto shrink-0 text-[9px] text-gray-500 font-mono">${n.dt!=null?n.dt+"s":""}</span>
                  </div>
                  <div class="flex items-center gap-1 text-[9px] text-gray-500">
                    <span class="font-mono shrink-0">${n.at||""}</span>
                    ${n.brief&&html`<span class="truncate" title=${n.brief}>· ${n.brief}</span>`}
                  </div>
                </div>
              </div>`)}
          </div></div>`:html`<div class="text-[11px] text-gray-600">（执行工具后自动生成执行时间轴）</div>`}
        </div>
      </aside>
    </div>

    ${mobilePanel==="status"&&html`<div class="fixed inset-0 z-30 bg-black/60 xl:hidden" onClick=${()=>setMobilePanel(null)}></div>`}

    <!-- 成果物预览弹窗 -->
    <${PreviewModal} p=${preview} onClose=${()=>setPreview(null)} notify=${notify}/>

    <!-- 记忆查看 / 技能管理 弹窗 -->
    ${showMem&&html`<${ErrorBoundary}><${MemoryModal} onClose=${()=>setShowMem(false)} cmd=${cmd}/><//>`}
    ${showSkills&&html`<${ErrorBoundary}><${SkillsModal} onClose=${()=>setShowSkills(false)} notify=${notify}/><//>`}
    ${showEnv&&html`<${ErrorBoundary}><${EnvModal} onClose=${()=>setShowEnv(false)} notify=${notify}/><//>`}
    ${showSched&&html`<${ErrorBoundary}><${ScheduleModal} onClose=${()=>setShowSched(false)} notify=${notify}/><//>`}
    ${showFiles&&html`<${ErrorBoundary}><${FilesModal} onClose=${()=>setShowFiles(false)} notify=${notify} busy=${busy}
      onRefFile=${f=>setFileRefs(x=>x.some(o=>o.abs_path===f.abs_path)?x:[...x,f])}
      onRefFiles=${fs=>setFileRefs(x=>{const seen=new Set(x.map(o=>o.abs_path));
        return [...x,...fs.filter(f=>!seen.has(f.abs_path))]})}
      onAnalyzeFile=${async f=>{const p=`请读取并分析文件 ${f.abs_path}（${fmtSize(f.size)}），总结其内容要点与结构，并给出优化建议。`;
        const r=await post("/api/task",{prompt:p,policy:buildPolicy()});
        if(!r.ok)pushItem({kind:"error",text:r.error||"提交失败"});}}/><//>`}

    <!-- 工作空间弹窗 -->
    ${showWorkspace&&html`<${ErrorBoundary}><${WorkspaceModal} onClose=${()=>setShowWorkspace(false)} busy=${busy} state=${state} notify=${notify}
      onRefFile=${f=>setFileRefs(x=>x.some(o=>o.abs_path===f.abs_path)?x:[...x,f])} /><//>`}

    <!-- 变更文件列表弹窗 -->
    ${showChanges&&html`<${ErrorBoundary}><${ChangesModal} onClose=${()=>setShowChanges(false)} files=${(changesData&&changesData.files)||[]} since=${(changesData&&changesData.since)||""} until=${(changesData&&changesData.until)||""} notify=${notify} /><//>`}

    <!-- 飞书配置弹窗 -->
    ${showFeishu&&html`<${ErrorBoundary}><${FeishuModal} onClose=${()=>setShowFeishu(false)} notify=${notify}/><//>`}

    <!-- MCP 服务配置弹窗 -->
    ${showMcp&&html`<${ErrorBoundary}><${McpModal} onClose=${()=>setShowMcp(false)} notify=${notify} busy=${busy}/><//>`}

    <!-- 模型接入配置弹窗(受控回显 + 常用模型快捷预设 + 可选持久化) -->
    ${showCfg&&html`<${ErrorBoundary}><${ConfigModal} onClose=${()=>setShowCfg(false)} state=${state} refresh=${refresh} notify=${notify}/><//>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
