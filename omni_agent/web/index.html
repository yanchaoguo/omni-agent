<style>
  /* 淡白色主题(浅白底 + 深灰文字), 简洁护眼 */
  body{background:#f7f8fa;color:#374151;font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}

  .flip-inner{position:relative;width:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}

  .flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flip-back{position:absolute;inset:0;transform:rotateY(180deg)}
  .glow{box-shadow:0 2px 18px #cbd5e144}

  .md-body{font-size:14px;line-height:1.75;color:#1f2937;word-break:break-word}
  .md-body h1,.md-body h2,.md-body h3,.md-body h4{font-weight:700;margin:.9em 0 .45em;color:#111827}

  .hs-cite:hover .hs-card{display:block}

  /* v8.5 移动端兼容: 触控目标增大 / 输入16px防iOS聚焦自动放大 / 卡片收窄 */
  @media (max-width:640px){
    button{min-height:32px}

    .max-w-2xl,.max-w-3xl{max-width:92vw !important}
    .msg-row .max-w-2xl{max-width:82vw !important}
  }
  .md-doc h1{font-size:1.6em}.md-doc h2{font-size:1.32em}.md-doc h3{font-size:1.15em}
  @keyframes hsdot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .hs-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#0891b2;margin:0 2px;animation:hsdot 1.2s infinite}
  .hs-dot:nth-child(2){animation-delay:.15s}.hs-dot:nth-child(3){animation-delay:.3s}
  /* 右侧执行时间轴 */
  .hs-tl{position:relative;padding-left:16px}
  .hs-tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#e2e6ec;border-radius:1px}
  .hs-tl-item{position:relative;display:flex;gap:6px;padding:3px 0}
  .hs-tl-dot{position:absolute;left:-15px;top:7px;width:8px;height:8px;border-radius:50%;background:#94a3b8;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
  .hs-tl-dot.ok{background:#059669;box-shadow:0 0 0 1px #05966955}
  .hs-tl-dot.error{background:#e11d48;box-shadow:0 0 0 1px #e11d4855}
  .hs-tl-dot.running{background:#0891b2;box-shadow:0 0 0 3px #a5f3fc;animation:pulse2 1.2s infinite}
  .hs-tl-turn{font-size:9px;color:#9ca3af;margin:5px 0 1px -16px;display:flex;align-items:center;gap:4px}
  .hs-tl-turn::before{content:"";flex:0 0 10px;height:1px;background:#d5d9df}
  .hs-tl-turn::after{content:"";flex:1;height:1px;background:#d5d9df}
  /* 终端风格 bash 输出块(深色仓, 不随浅色主题重映射) */
  .term-block{background:#1b212e;color:#d6e2f0;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:11.5px;line-height:1.55;margin-top:4px;overflow:hidden}
  .term-head{display:flex;align-items:center;gap:6px;padding:5px 10px;background:#141924;color:#8b98ab}
  .term-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .term-body{padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .term-body::-webkit-scrollbar-thumb{background:#3a4356}
  .term-err{color:#fda4af;border-top:1px dashed #3a4356;margin-top:6px;padding-top:6px}

  /* Swarm 树状连接线 */
  .tree-node{position:relative;padding-left:22px}
  .tree-node::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:#d5d9df}
  .tree-node:last-child::before{bottom:auto;height:14px}
  .tree-node::after{content:"";position:absolute;left:8px;top:13px;width:12px;height:1px;background:#d5d9df}
  /* —— 淡白主题适配层: 将原暗色工具类重映射为浅色等价色 —— */
  .bg-\[\#0d1320\]{background-color:#ffffff!important}
  .bg-black\/20{background-color:#f3f4f6!important}
  .bg-black\/25{background-color:#f3f4f6!important}

<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef,useCallback,useMemo} = React;
const html = htm.bind(React.createElement);
/* api() 安全JSON解析兜底 —— 网关502/空响应/HTML错误页等非JSON响应不再抛未捕获异常
   导致UI静默卡死; 统一降级为结构化 {ok:false,error}; 纯网络故障抛带上下文的Error(GET调用方均有catch) */
const api = async (p,opt)=>{
  let r;
  try{ r=await fetch(p,opt); }
  catch(e){ throw new Error("网络连接失败("+p+"): "+((e&&e.message)||e)); }
  const raw=await r.text().catch(()=>"");
  try{ return JSON.parse(raw); }
  catch(_){
    const brief=(raw||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160);
    return {ok:false,error:(r.ok?"响应不是有效JSON":"HTTP "+r.status+" "+(r.statusText||""))+(brief?": "+brief:"")};
  }
};
/* post() 永不抛异常 —— 网络异常统一折叠为 {ok:false,error}, 全部调用方经 r.ok 分支即可给出用户提示 */
const post = (p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
  .catch(e=>({ok:false,error:String((e&&e.message)||e)}));

/* ---------- 工具函数 ---------- */
function fmtSize(n){if(n>1048576)return (n/1048576).toFixed(1)+" MB";if(n>1024)return (n/1024).toFixed(1)+" KB";return (n||0)+" B"}
const FILE_ICONS={html:"🌐",htm:"🌐",pdf:"📕",png:"🖼",jpg:"🖼",jpeg:"🖼",gif:"🖼",svg:"🖼",webp:"🖼",
  mp3:"🎵",wav:"🎵",ogg:"🎵",mp4:"🎬",webm:"🎬",zip:"🗜",md:"",txt:"📄",csv:"",
  docx:"📘",doc:"📘",xlsx:"📗",xls:"📗",pptx:"📙",ppt:"📙",
  py:"🐍",js:"📜",json:"⚙",css:"🎨",sh:"⚙",log:"📄",dir:"📂"};
const fileIcon=ext=>FILE_ICONS[(ext||"").toLowerCase()]||"📄";
const IMG_EXT=["png","jpg","jpeg","gif","svg","webp","ico"];
const AV_EXT={mp3:"audio",wav:"audio",ogg:"audio",m4a:"audio",aac:"audio",flac:"audio",mp4:"video",webm:"video",mov:"video"};
const NEWTAB_EXT=["html","htm","pdf"];
const TEXT_EXT=["md","markdown","txt","py","js","json","css","csv","log","xml","yml","yaml","sh",
  "ts","tsx","jsx","vue","mjs","cjs","go","java","kt","c","h","cc","cpp","hpp","cs","rs","rb","php","pl",
  "swift","scala","lua","r","sql","toml","ini","cfg","conf","env","properties","gradle","bat","ps1",
  "dockerfile","makefile","gitignore","editorconfig","tex","rst","diff","patch","proto","graphql",
  "sass","scss","less"];
/* 文件管理中支持在线查看的扩展名(文本/图片/音视频/HTML/PDF);
   docx/pptx/xlsx/zip 等二进制类型不支持在线查看 → 查看按钮禁用(仅可下载) */
const VIEWABLE_EXT=new Set([...TEXT_EXT,...IMG_EXT,"html","htm","pdf","mp3","wav","ogg","m4a","aac","flac","mp4","webm","mov","sql","ts","java","go","rs","c","cpp","ini","toml","cfg","conf","bat","xlsx","tsv"]);

/* ---------- Markdown 渲染(marked + DOMPurify 消毒, 防XSS) ---------- */
/* 数据引用统一悬浮卡片 —— md 文件中的脚注文献列表([^n]: [标题](url) — 机构 · 日期)
   解析为信源字典, 行内 [^n] 与 [[n]] 统一渲染为悬停式信源卡片角标(与后端 HTML 报告一致) */
const escHtml=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function renderCitations(text){
  const defs={};
  // ① 提取并剥离文末脚注定义行(正序无关, 按序号索引)
  let body=(text||"").replace(/^\[\^(\d+)\]:\s*(.+)$/gm,(m,n,rest)=>{
    let title=rest.trim(),url="",meta="";
    const lm=/^\[([^\]]*)\]\(([^)\s]+)\)\s*(?:[—–-]\s*)?(.*)$/.exec(rest.trim());
    if(lm){title=lm[1]||lm[2];url=lm[2];meta=(lm[3]||"").trim();}
    defs[n]={title,url,meta};
    return "";
  });
  if(!Object.keys(defs).length&&!/\[\[\d+\]\]/.test(body)&&!/\[\^\d+\](?!:)/.test(body)){
    // 无引用定义但可能有 ==高亮== 语法
    const hl=body.replace(/==([^=\n]{1,120})==/g,'<mark class="hs-hl">$1</mark>');
    if(hl!==body)return {body:hl,cited:true};
    return {body:text,cited:false};
  }
  // ② [[n]] 归一化为 [^n], 统一引用序号标准
  body=body.replace(/\[\[(\d+)\]\]/g,"[^$1]");
  // ③ 行内引用 → 悬浮卡片角标
  body=body.replace(/\[\^(\d+)\](?!:)/g,(m,n)=>{
    const d=defs[n];
    if(!d)return `<sup class="hs-cite">[${n}]</sup>`;
    const link=d.url?`<a class="hs-title" href="${escHtml(d.url)}" target="_blank" rel="noopener">${escHtml(d.title)}</a>`
      :`<span class="hs-title">${escHtml(d.title)}</span>`;
    const meta=d.meta?`<span class="hs-meta">${escHtml(d.meta)}</span>`:"";
    return `<sup class="hs-cite">[${n}]<span class="hs-card">${link}${meta}</span></sup>`;
  });
  // ==高亮文本== → <mark> (marked@12 GFM 不支持此语法, 预替换后透传)
  body=body.replace(/==([^=\n]{1,120})==/g,'<mark class="hs-hl">$1</mark>');
  return {body,cited:true};
}
function Markdown({text,className}){
  const htmlStr = React.useMemo(()=>{
    try{
      const {body}=renderCitations(text||"");
      return DOMPurify.sanitize(marked.parse(body,{breaks:true,gfm:true}),{ADD_ATTR:["target"]});
    }
    catch(_){return (text||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
  },[text]);
  return html`<div class="md-body ${className||""}" dangerouslySetInnerHTML=${{__html:htmlStr}}></div>`;
}
/* 快速复制标签(用户消息 hover 显示, 点击复制全文) */
function CopyTag({text}){
  const [ok,setOk]=useState(false);
  const doCopy=async()=>{
    try{await navigator.clipboard.writeText(text||"")}
    catch(_){const ta=document.createElement("textarea");ta.value=text||"";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(__){}document.body.removeChild(ta)}
    setOk(true);setTimeout(()=>setOk(false),1500);
  };
  return html`<button class="copy-tag shrink-0" onClick=${doCopy} title="复制此消息">${ok?"✓ 已复制":"⧉"}</button>`;
}
/* 成果物文件URL统一构造(携带归属工作目录wd) */
const fileUrl=(kind,f)=>"/api/"+kind+"?path="+encodeURIComponent(f.path)+(f.wd?"&wd="+encodeURIComponent(f.wd):"");

/* ---------- 全局表格预览(csv/tsv/xlsx) —— 多工作表Tab + 冻结表头 + 斑马纹 ---------- */
const TABLE_EXT=["csv","tsv","xlsx"];
function TableView({sheets,truncated}){
  const [si,setSi]=useState(0);
  const sheet=(sheets||[])[si]||{rows:[]};
  const rows=sheet.rows||[];
  const cols=rows.reduce((m,r)=>Math.max(m,r.length),0);
  const head=rows[0]||[];
  return html`<div class="w-full">
    ${(sheets||[]).length>1&&html`<div class="flex gap-1 mb-2 flex-wrap">
      ${sheets.map((s,i)=>html`<button key=${i} onClick=${()=>setSi(i)}
        class="text-[10px] px-2 py-0.5 rounded ${i===si?"bg-cyan-700 text-white":"bg-gray-800 text-gray-400 hover:text-gray-200"}"> ${s.name||("Sheet"+(i+1))}</button>`)}
    </div>`}
    ${rows.length===0?html`<div class="text-xs text-gray-500 text-center py-6">（空表格）</div>`
    :html`<div class="overflow-auto max-h-[66vh] rounded-lg border border-gray-700">
      <table class="text-[11px] border-collapse min-w-full">
        <thead><tr>
          <th class="sticky top-0 z-10 bg-gray-800 text-gray-500 px-2 py-1 border border-gray-700 text-right">#</th>
          ${Array.from({length:cols},(_,i)=>html`<th key=${i} class="sticky top-0 z-10 bg-gray-800 text-cyan-300 px-2 py-1 border border-gray-700 text-left whitespace-nowrap max-w-[280px] truncate" title=${head[i]||""}>${head[i]||""}</th>`)}
        </tr></thead>
        <tbody>
          ${rows.slice(1).map((r,ri)=>html`<tr key=${ri} class=${ri%2?"bg-black/20":""}>
            <td class="text-gray-600 px-2 py-0.5 border border-gray-800 text-right">${ri+2}</td>
            ${Array.from({length:cols},(_,ci)=>html`<td key=${ci} class="text-gray-300 px-2 py-0.5 border border-gray-800 whitespace-nowrap max-w-[280px] truncate" title=${r[ci]||""}>${r[ci]||""}</td>`)}
          </tr>`)}
        </tbody>
      </table>
    </div>`}
    <div class="text-[10px] text-gray-500 mt-1">共 ${rows.length} 行 × ${cols} 列${(sheets||[]).length>1?(" · "+sheets.length+" 个工作表"):""}${truncated?html`<span class="text-yellow-500"> · 内容较大, 仅预览部分数据, 完整内容请下载查看</span>`:""}</div>
  </div>`;
}
/* 等待 loading 指示器(贯穿任务全程 —— 思考结束后/工具执行间隙/回合切换均显示,
   任务完成或异常退出时随 busy=false 自动退场) */
function LoadingDots({label}){return html`<div class="my-2 flex items-center gap-2 text-xs text-gray-500">
  <span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span>
  </div>`}

/* ---------- 倒计时 Hook ---------- */
function useCountdown(sec){
  const [left,setLeft]=useState(sec);
  useEffect(()=>{const t=setInterval(()=>setLeft(x=>x>0?x-1:0),1000);return()=>clearInterval(t)},[]);
  return left;
}

/* ---------- 审批卡片 ---------- */
function ApprovalCard({e,onDone}){
  const left=useCountdown(e.timeout||90);
  const [done,setDone]=useState(null);
  const act=v=>{post("/api/reply",{id:e.id,value:v});setDone(v);onDone&&onDone()};
  return html`<div class="card p-4 my-2 border-yellow-600/60 glow">
    <div class="flex items-center gap-2 text-yellow-400 font-bold text-sm"> 审批请求 · ${e.tool}
      ${done==null&&html`<span class="ml-auto text-xs text-gray-400">剩余 ${left}s（超时默认放行）</span>`}</div>
    <pre class="text-xs text-gray-300 mt-2 max-h-32 overflow-auto">${e.detail}</pre>
    ${done==null?html`<div class="flex gap-2 mt-3">

/* ---------- Bash 终端风格输出(exit码徽标 + stdout/stderr 分段高亮) ---------- */
function BashResult({result,cmd}){
  /* 防御: result 可能为非字符串(异常/超时场景), 强制转字符串避免渲染崩溃 */
  result=typeof result==="string"?result:(result==null?"":(()=>{try{return JSON.stringify(result)}catch(_){return String(result)}})());
  const m=/^\[exit=(-?\d+)\]\n?/.exec(result||"");
  const code=m?parseInt(m[1]):null;
  let body=m?(result||"").slice(m[0].length):(result||"");
  let err="";
  const ei=body.indexOf("\n[stderr]\n");
  if(ei>=0){err=body.slice(ei+10);body=body.slice(0,ei);}
  return html`<div class="term-block">
    <div class="term-head">
      <span class="term-dot" style=${{background:"#f87171"}}></span>
      <span class="term-dot" style=${{background:"#fbbf24"}}></span>
      <span class="term-dot" style=${{background:"#34d399"}}></span>
      <span class="text-[10px] font-bold">bash</span>
      ${cmd&&html`<span class="term-cmd truncate">$ ${cmd}</span>`}
      ${code!=null&&html`<span class="ml-auto text-[10px] px-2 py-0.5 rounded-full shrink-0"
        style=${{background:code===0?"#064e3b":"#7f1d1d",color:code===0?"#6ee7b7":"#fca5a5"}}>exit ${code}</span>`}
    </div>
    <div class="term-body">${body.trim()||"(无输出)"}${err&&html`<div class="term-err">[stderr]\n${err.trim()}</div>`}</div>
  </div>`;
}

/* ---------- web_search 搜索引擎风格结果(icon + 标题链接 + 摘要 + 来源 + 时间, 支持批量查询) ---------- */
function SearchHit({h}){
  return html`<div class="flex gap-2 py-1.5 border-b border-gray-800/60">
    ${h.icon?html`<img src=${h.icon} onError=${e=>{e.target.outerHTML="🌐"}} class="w-4 h-4 rounded mt-0.5 shrink-0"/>`:html`<span class="text-[11px] mt-0.5 shrink-0">🌐</span>`}
    <div class="min-w-0 flex-1">
      <a href=${h.url} target="_blank" rel="noreferrer" title=${h.url}
        class="text-[12px] text-cyan-300 hover:underline font-semibold leading-snug block truncate">${h.title}</a>
      ${h.snippet&&html`<div class="text-[11px] text-gray-400 leading-relaxed mt-0.5">${h.snippet}</div>`}
      <div class="flex items-center gap-2 mt-0.5 text-[10px]">
        <span class="text-emerald-600 truncate max-w-[240px]">${h.site||h.host||""}</span>
        ${h.date&&html`<span class="text-gray-500 shrink-0">🕒 ${h.date}</span>`}
        ${h.sid&&html`<span class="text-gray-600 shrink-0">[[${h.sid}]]</span>`}
      </div>
    </div>
  </div>`;
}
function WebSearchResult({result,srcs}){
  /* 解析 t_web_search 文本协议: "◈ 查询: q" 块 -> "[[sid]] title / url / snippet" 三行组 */
  const meta={};(srcs||[]).forEach(s=>{meta[s.id]=s});
  const blocks=[];let cur=null;
  for(const raw of (result||"").split("\n")){
    const ln=raw.trim();
    const q=/^◈ 查询:\s*(.*)$/.exec(ln);
    if(q){cur={query:q[1],hits:[],failed:""};blocks.push(cur);continue}
    if(!cur)continue;
    if(/^\[失败\]/.test(ln)){cur.failed=ln;continue}
    const t=/^\[\[(\d+)\]\]\s*(.*)$/.exec(ln);
    if(t){cur.hits.push({sid:+t[1],title:t[2],url:"",snippet:""});continue}
    const last=cur.hits[cur.hits.length-1];
    if(!last)continue;
    if(/^https?:\/\//.test(ln)&&!last.url)last.url=ln;
    else if(ln&&!ln.startsWith("(搜索源")&&!ln.startsWith("提示:")&&last.url&&!last.snippet)last.snippet=ln;
  }
  const enrich=h=>{const m=meta[h.sid]||{};let sn=h.snippet||m.snippet||"";
    const dm=/^\((20\d{2}-\d{2}-\d{2})\)\s*/.exec(sn);let date=m.date||"";
    if(dm){date=date||dm[1];sn=sn.slice(dm[0].length)}
    let host="";try{host=new URL(h.url).hostname.replace(/^www\./,"")}catch(_){}
    return {...h,snippet:sn,date,site:m.siteName||m.org||"",icon:m.siteIcon||"",host}};
  if(blocks.length===0) return html`<pre class="text-[11px] text-gray-400 bg-black/30 rounded p-2 mt-1 max-h-48 overflow-auto">${result}</pre>`;
  return html`<div class="bg-black/30 rounded-lg px-3 py-2 mt-1 max-h-96 overflow-auto">
    ${blocks.map((b,i)=>html`<div key=${i} class="mb-2">
      <div class="text-[10px] text-gray-500 mb-0.5"> 查询: <span class="text-gray-300 font-semibold">${b.query}</span>${b.hits.length?html` · ${b.hits.length} 条结果`:""}</div>
      ${b.failed&&html`<div class="text-[11px] text-rose-400">${b.failed}</div>`}
      ${b.hits.map((h,j)=>html`<${SearchHit} key=${j} h=${enrich(h)}/>`)}
    </div>`)}
    <div class="text-[9px] text-gray-600 mt-1">搜索源: UniFuncs 聚合搜索 · 点击标题跳转原文</div>
  </div>`;
}

/* ---------- web_fetch 阅读器富渲染([标题](url) + Markdown 正文, 支持批量抓取) ---------- */
function WebFetchResult({result}){
  const raw=(result||"").replace(/^\[批量抓取[^\]]*\]\s*/,"");
  const blocks=raw.split(/\n\n━+\n\n/).map(b=>b.trim()).filter(Boolean);
  const parse=b=>{
    const m=/^◈\s*(.*?)\s*\[\[(\d+)\]\][^\n]*\nURL:\s*(\S+)/.exec(b);
    if(m){const cut=b.indexOf("\n\n");return{title:m[1],sid:m[2],url:m[3],body:cut>=0?b.slice(cut+2):"",failed:false}}
    return {title:"",sid:"",url:"",body:b,failed:/^\[失败\]/.test(b)};
  };
  if(blocks.length===0) return html`<pre class="text-[11px] text-gray-400 bg-black/30 rounded p-2 mt-1 max-h-48 overflow-auto">${result}</pre>`;
  return html`<div class="bg-black/30 rounded-lg px-3 py-2 mt-1 max-h-[28rem] overflow-auto space-y-3">
    ${blocks.length>1&&html`<div class="text-[10px] text-gray-500">📚 批量抓取 ${blocks.length} 个 URL</div>`}
    ${blocks.map((b,i)=>{const p=parse(b);
      return html`<div key=${i}>
        ${p.title&&html`<div class="flex items-center gap-1.5 mb-1 min-w-0">
          <span class="text-xs shrink-0">📄</span>
          <a href=${p.url} target="_blank" rel="noreferrer" title=${p.url}
            class="text-[12px] text-cyan-300 hover:underline font-semibold truncate">${p.title}</a>
          <span class="text-[10px] text-gray-600 shrink-0">[[${p.sid}]]</span></div>`}
        ${p.failed?html`<div class="text-[11px] text-rose-400 whitespace-pre-wrap">${p.body}</div>`
          :html`<div class="bg-white border border-gray-200 rounded-lg p-2.5 max-h-80 overflow-auto"><${Markdown} text=${p.body} className="md-doc"/></div>`}
      </div>`})}
  </div>`;
}

/* ---------- 工具时间线(执行中实时计时loading + 完成后显示最终执行时间) ---------- */
function ToolCard({start,end}){
  const [open,setOpen]=useState(false);
  const [elapsed,setElapsed]=useState(0);
  useEffect(()=>{   // 执行中: 每秒刷新已耗时长, 作为耗时工具的 loading 标识
    if(end)return;
    const t0=Date.now();
    const t=setInterval(()=>setElapsed(Math.floor((Date.now()-t0)/1000)),1000);
    return()=>clearInterval(t);
  },[end]);
  const ok=end&&!/^\[(错误|失败|已拒绝|超时|工具执行异常)/.test(end.result||"");
  /* 优先显示中文 title, 无 title 时回退方法名(tool) */
  const label=(end&&end.title)||(start&&start.title)||start.tool;
  /* 回放历史时 dt 可能为 undefined(旧数据)或数字(持久化数据) */
  const dtVal=end?end.dt:start.dt;
  return html`<div class="my-1.5 pl-3 border-l-2 ${end?(ok?"border-emerald-600":"border-rose-600"):"border-cyan-500"}">
    <div class="flex items-center gap-2 text-xs cursor-pointer" onClick=${()=>setOpen(o=>!o)}>
      <span class=${end?(ok?"text-emerald-400":"text-rose-400"):"text-cyan-400 blink"}>${end?(ok?"⏺":"⊘"):"◐"}</span>
      <span class="font-semibold text-cyan-300">${label}</span>
      <span class="text-gray-600 text-[10px] font-mono">${start.tool!==label?start.tool:""}</span>
      <span class="text-gray-500 truncate max-w-md">${start.brief||""}</span>
      ${end?html`<span class="text-gray-600 ml-auto shrink-0" title="工具最终执行时间"> ${dtVal!=null?dtVal+"s":"-"}</span>`
        :html`<span class="text-cyan-500 blink ml-auto shrink-0 flex items-center gap-1">
          <span class="hs-dot"></span><span class="hs-dot"></span><span class="hs-dot"></span>
          执行中 ${elapsed}s</span>`}
    </div>
    ${open&&end&&(start.tool==="bash"
      ?html`<${BashResult} result=${end.result} cmd=${(start.brief||"").replace(/^【[^】]*】\s*/,"")}/>`
      :start.tool==="web_search"?html`<${WebSearchResult} result=${end.result} srcs=${end.srcs}/>`
      :start.tool==="web_fetch"?html`<${WebFetchResult} result=${end.result}/>`
      :html`<pre class="text-[11px] text-gray-400 bg-black/30 rounded p-2 mt-1 max-h-48 overflow-auto">${end.result}</pre>`)}
  </div>`;
}

/* ---------- Swarm 子任务树状卡片(工具执行顺序 + 结果) ---------- */
function SwarmToolNode({t}){
  const [open,setOpen]=useState(false);
  const ok=!/^\[(错误|失败|已拒绝|超时|工具执行异常)/.test(t.result||"");
  return html`<div class="tree-node py-0.5">
    <div class="flex items-center gap-1.5 text-[11px] cursor-pointer" onClick=${()=>setOpen(o=>!o)}>
      <span class=${ok?"text-emerald-500":"text-rose-400"}>${ok?"⏺":"⊘"}</span>
      <span class="font-mono text-cyan-600">${t.tool}</span>
      <span class="text-gray-500 truncate max-w-xs">${t.brief||""}</span>
      <span class="text-gray-600 ml-auto shrink-0">${t.dt}s ${open?"▲":"▼"}</span>
    </div>
    ${open&&html`<pre class="text-[10px] text-gray-400 bg-black/25 rounded p-2 mt-1 max-h-40 overflow-auto">${t.result||"(无输出)"}</pre>`}
  </div>`;
}
function SwarmTaskNode({idx,t}){
  const [open,setOpen]=useState(false);
  const icon=t.status==="running"?"◐":t.status==="failed"?"":t.status==="done"?"●":"○";
  const color=t.status==="running"?"text-cyan-500 blink":t.status==="failed"?"text-rose-400":t.status==="done"?"text-emerald-500":"text-gray-500";
  return html`<div class="tree-node py-1">
    <div class="flex items-start gap-1.5">
      <span class="${color} text-xs mt-0.5">${icon}</span>
      <div class="flex-1 min-w-0">
        <div class="text-xs text-gray-300"><span class="font-bold text-gray-400">子任务${idx+1}</span> ${t.task}</div>
        ${t.tools.length>0&&html`<div class="mt-1 ml-1">${t.tools.map((tl,i)=>html`<${SwarmToolNode} key=${i} t=${tl}/>`)}</div>`}
        ${t.output&&html`<div class="mt-1">
          <button onClick=${()=>setOpen(o=>!o)} class="text-[10px] px-2 py-0.5 rounded border ${t.status==="failed"?"border-rose-300 text-rose-400":"border-emerald-300 text-emerald-500"} hover:bg-emerald-900/40">
            ${open?"收起结论 ▲":"查看结论 ▼"}${t.partial?" (部分)":""}</button>
          ${open&&html`<div class="mt-1 bg-black/20 rounded-lg p-2 max-h-56 overflow-auto"><${Markdown} text=${t.output}/></div>`}
        </div>`}
      </div>
    </div>
  </div>`;
}
function SwarmCard({it}){
  const total=it.tasks.length, done=it.tasks.filter(t=>t.status==="done"||t.status==="failed").length;
  return html`<div class="card p-3 my-2 border-fuchsia-300 glow">
    <div class="flex items-center gap-2 text-xs font-bold text-fuchsia-400">
      ⚡ 启动狼群模式 <span class="text-gray-500 font-normal">${done}/${total} 完成</span>
      ${!it.done&&html`<span class="text-cyan-500 blink font-normal ml-auto">执行中…</span>`}
      ${it.done&&html`<span class="text-emerald-500 font-normal ml-auto">✓ 全部完成</span>`}
    </div>
    <div class="h-1 bg-gray-800 rounded-full mt-1.5 mb-1"><div class="h-1 bg-fuchsia-400 rounded-full transition-all" style=${{width:(total?done/total*100:0)+"%"}}></div></div>
    <div class="mt-1">${it.tasks.map((t,i)=>html`<${SwarmTaskNode} key=${i} idx=${i} t=${t}/>`)}</div>
  </div>`;
}

/* ---------- 成果物卡片: 交付成功后的预览与下载(不支持预览的类型仅提供下载) ---------- */

/* ---------- Markdown 双栏编辑器 —— 默认单栏预览, 可切换双栏实时编辑, 保存覆盖原文件 ---------- */
function MdPane({name,path,wd,content,truncated,notify}){
  const [mode,setMode]=useState("preview");   /* preview=单栏预览 | edit=双栏实时编辑 */
  const [text,setText]=useState(content||"");
  const [dirty,setDirty]=useState(false);
  const [saving,setSaving]=useState(false);
  useEffect(()=>{setText(content||"");setDirty(false);setMode("preview")},[content,path]);
  const save=async()=>{
    if(!path){notify&&notify("该文件缺少路径信息, 无法在线保存",true);return}
    if(truncated&&!confirm("原文件较大已被截断预览, 保存将仅写入当前编辑框内容(可能丢失截断部分), 确认覆盖?"))return;
    setSaving(true);
    let r;
    try{ r=await post("/api/md_save",{path,wd:wd||"",content:text}); }
    catch(err){ r={ok:false,error:"网络异常: "+String((err&&err.message)||err)}; }
    setSaving(false);
    if(r&&r.ok){setDirty(false);notify&&notify(r.msg||"✓ 已保存并覆盖原文件")}
    else notify&&notify((r&&r.error)||"保存失败",true);
  };
  return html`<div class="w-full flex flex-col min-h-0">
    <div class="flex items-center gap-2 mb-2 shrink-0">
      <span class="text-[10px] px-1.5 py-0.5 rounded-full border ${mode==="preview"?"border-violet-300 text-violet-500":"border-cyan-400 text-cyan-600"}">${mode==="preview"?"单栏预览":"双栏实时编辑"}</span>
      ${dirty&&html`<span class="text-[10px] text-amber-500">● 有未保存的修改</span>`}
      <span class="ml-auto flex gap-1.5">
        ${mode==="edit"&&html`<button onClick=${save} disabled=${saving||!dirty}
          class="text-[11px] px-2.5 py-1 rounded-lg ${dirty?"bg-emerald-600 hover:bg-emerald-500 text-white":"bg-gray-200 text-gray-400 cursor-not-allowed"}">${saving?" 保存中…":"💾 保存(覆盖原文件)"}</button>`}
        <button onClick=${()=>setMode(m=>m==="preview"?"edit":"preview")} title=${mode==="preview"?"切换到双栏实时编辑(左编辑/右预览)":"返回单栏预览"}
          class="text-[11px] px-2.5 py-1 rounded-lg border ${mode==="preview"?"border-cyan-500 text-cyan-600 hover:bg-cyan-50":"border-gray-300 text-gray-600 hover:border-violet-400"}">${mode==="preview"?"✎ 双栏编辑":"👁 单栏预览"}</button>
      </span>
    </div>
    ${mode==="preview"
      ?html`<div class="flex-1 overflow-auto min-h-0"><${Markdown} text=${text} className="md-doc"/></div>`
      :html`<div class="flex-1 grid grid-cols-2 gap-2 min-h-0" style=${{minHeight:"55vh"}}>
        <textarea value=${text} spellcheck="false" placeholder="在此编辑 Markdown 源文, 右侧实时渲染…"
          onInput=${e=>{setText(e.target.value);setDirty(true)}}
          class="w-full h-full resize-none rounded-lg border border-gray-300 bg-gray-50 text-gray-800 font-mono text-xs leading-relaxed p-3 outline-none focus:border-cyan-500"></textarea>
        <div class="overflow-auto rounded-lg border border-gray-200 bg-white p-3 min-h-0 h-full"><${Markdown} text=${text} className="md-doc"/></div>
      </div>`}
  </div>`;
}

/* ---------- 历史对话面板: 切换/重命名/置顶/删除/新建 ---------- */
function SessionPanel({busy,notify,onSessionChanged,ver}){
  const [list,setList]=useState([]);
  const [cur,setCur]=useState(null);
  const [editSid,setEditSid]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [search,setSearch]=useState("");
  const [showOld,setShowOld]=useState(false);
  const load=useCallback(()=>api("/api/sessions").then(r=>{setList(r.sessions||[]);setCur(r.current)}).catch(()=>{}),[]);
  useEffect(()=>{load()},[ver]);  /* ver=服务端sessions事件信号, 任务固化名称/结束后自动刷新列表 */
  const op=async(action,sid,value)=>{const r=await post("/api/session",{action,sid,value:value||""});notify(r.msg||r.error,!r.ok);load();if(r.ok&&(action==="switch"||action==="new")&&onSessionChanged)onSessionChanged(action)};
  /* 搜索过滤 + 三日前折叠 */
  const q=(search||"").toLowerCase().trim();
  const now=Date.now(); const _3dAgo=now-3*24*3600*1000;
  const filtered=list.filter(it=>!q||(it.name_zh||it.session_id||"").toLowerCase().includes(q)||(it.task_type||"").toLowerCase().includes(q));
  const recent=q?filtered:filtered.filter(it=>{const d=new Date((it.updated||"").replace(/-/g,"/")).getTime()||0;return d>=_3dAgo||it.pinned||it.session_id===cur});
  const older=q?[]:filtered.filter(it=>!recent.includes(it));
  return html`<div class="mb-4">
    <div class="flex items-center text-xs font-bold text-gray-400 mb-2"> 历史对话
      <button disabled=${busy} onClick=${()=>op("new")}
        class="ml-auto text-[10px] px-1.5 py-0.5 rounded border border-gray-700 hover:border-cyan-500 ${busy?"opacity-40":""}">＋新对话</button></div>
    ${list.length>5&&html`<div class="mb-2 relative">
      <input value=${search} onInput=${e=>setSearch(e.target.value)} placeholder=" 搜索会话..."
        class="w-full bg-black/30 border border-gray-700 rounded-lg px-2.5 py-1 pr-7 text-[11px] outline-none focus:border-cyan-500 text-gray-300"/>
      ${search&&html`<button onClick=${()=>setSearch("")} title="清空搜索"
        class="absolute right-1.5 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center rounded-full text-gray-400 hover:text-rose-500 hover:bg-gray-200 text-[10px] leading-none">✕</button>`}
    </div>`}
    ${filtered.length===0&&html`<div class="text-[11px] text-gray-600">${q?"（无匹配会话）":"（暂无历史对话）"}</div>`}
    <div class="space-y-1">
      ${recent.map(it=>{
        const active=it.session_id===cur;
        /* onClick 提升到整张卡片 —— 点击任意空白区域均可切换会话 */
        return html`<div key=${it.session_id}
          onClick=${()=>editSid!==it.session_id&&!active&&!busy&&op("switch",it.session_id)}
          class="group rounded-lg px-2 py-1.5 border ${active?"border-cyan-700 bg-cyan-900/20":"border-transparent hover:bg-gray-800/60 cursor-pointer"}">
          ${editSid===it.session_id
            ?html`<input autoFocus value=${editVal} onInput=${e=>setEditVal(e.target.value)}
                onClick=${e=>e.stopPropagation()}
                onKeyDown=${e=>{if(e.key==="Enter"&&editVal.trim()){op("rename",it.session_id,editVal.trim());setEditSid(null)}if(e.key==="Escape")setEditSid(null)}}
                onBlur=${()=>setEditSid(null)}
                class="w-full bg-black/40 border border-cyan-600 rounded px-1.5 py-0.5 text-[11px] outline-none"/>`
            :html`<div class="flex items-center gap-1">
                ${it.pinned&&html`<span class="text-yellow-500 text-[10px]"></span>`}
                <span class="text-[11px] truncate flex-1 ${active?"text-cyan-300":"text-gray-300"}">${it.name_zh||it.session_id}</span>
                ${active&&html`<span class="text-[9px] text-cyan-600">当前</span>`}
              </div>
              <div class="flex items-center gap-1 mt-0.5">
                <span class="text-[9px] text-gray-600 truncate flex-1">${it.task_type||""} · ${(it.updated||"").slice(5,16)}</span>
                <span class="hidden group-hover:flex gap-1">
                  <button title="重命名" onClick=${e=>{e.stopPropagation();setEditSid(it.session_id);setEditVal(it.name_zh||"")}} class="text-[10px] text-gray-500 hover:text-cyan-400">✎</button>
                  <button title=${it.pinned?"取消置顶":"置顶"} onClick=${e=>{e.stopPropagation();op("pin",it.session_id)}} class="text-[10px] text-gray-500 hover:text-yellow-400">${it.pinned?"📍":""}</button>
                  ${!active&&html`<button title="删除" onClick=${e=>{e.stopPropagation();if(confirm("删除对话「"+(it.name_zh||it.session_id)+"」？(仅移出列表, 不删文件)"))op("delete",it.session_id)}}
                    class="text-[10px] text-gray-500 hover:text-rose-400"></button>`}
                </span>
              </div>`}
        </div>`})}
    </div>
    ${older.length>0&&!q&&html`
      <button onClick=${()=>setShowOld(!showOld)}
        class="mt-2 text-[10px] text-gray-500 hover:text-cyan-400 w-full text-left">
        ${showOld?"▼ 收起":"▶ "} ${older.length} 个更早的会话 (3天前)
      </button>
      ${showOld&&html`<div class="space-y-1 mt-1">
        ${older.map(it=>{
          const active=it.session_id===cur;
          return html`<div key=${it.session_id}
            onClick=${()=>!active&&!busy&&op("switch",it.session_id)}
            class="group rounded-lg px-2 py-1.5 border ${active?"border-cyan-700 bg-cyan-900/20":"border-transparent hover:bg-gray-800/60 cursor-pointer"}">
            <div class="flex items-center gap-1">
              ${it.pinned&&html`<span class="text-yellow-500 text-[10px]"></span>`}
              <span class="text-[11px] truncate flex-1 ${active?"text-cyan-300":"text-gray-300"}">${it.name_zh||it.session_id}</span>
              <span class="text-[9px] text-gray-600">${(it.updated||"").slice(5,11)}</span>
            </div>
          </div>`})}
      </div>`}
    `}
  </div>`;
}
